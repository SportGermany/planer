<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://de.wikipedia.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pause</title>
<meta name="theme-color" content="#17181b">
<meta name="description" content="Kluge Ablenkung statt Kurzvideos: Zitate, Wissen, Alltagshilfen, Quiz und Politik & Wirtschaft verstehen - fuer Zwischendurch.">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pause">
<style>
:root{
  --bg:#17181b; --panel:#202226; --panel-2:#26282d; --panel-3:#2d3036;
  --line:#34363c; --text:#eceef0; --text-dim:#9a9ea6; --text-faint:#63666e;
  --zitate:#4fd1b5; --zitate-dim:#1d3833;
  --wissen:#6fa8ea; --wissen-dim:#1e2c3d;
  --alltag:#e8b463; --alltag-dim:#3a3020;
  --politik:#c98bd9; --politik-dim:#332338;
  --wiki:#5ecbd8; --wiki-dim:#1c3338;
  --aktuell:#ff6b4a; --aktuell-dim:#3a2018;
  --raetsel:#f2c94c; --raetsel-dim:#3a3218;
  --danger:#e0645f; --ok:#8fd15c;
  --nav-h:60px; --nav-w:84px;
}
html[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#eceef1; --panel-3:#e2e5ea;
  --line:#d8dbe0; --text:#1b1c1f; --text-dim:#5d616a; --text-faint:#8b909a;
  --zitate-dim:#d9f4ee; --wissen-dim:#dce9fa; --alltag-dim:#faeed6; --politik-dim:#f0e0f5; --wiki-dim:#dcf1f4; --aktuell-dim:#ffe4db; --raetsel-dim:#fbf1d2;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; overscroll-behavior:none; }
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{ font-family:inherit; }
input,select,textarea{ font-size:16px; }
h1,h2,h3,p{ margin:0; }

.shell{ max-width:480px; margin:0 auto; min-height:100dvh; position:relative;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px); }
.screen{ display:none; padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px; }
.screen.active{ display:flex; flex-direction:column; animation:fade .18s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
.top h1{ font-size:22px; font-weight:660; letter-spacing:-.02em; margin:0 0 3px; }
.top p{ margin:0; font-size:13px; color:var(--text-dim); }
.streak-chip{ display:inline-flex; align-items:center; gap:6px; flex:none;
  background:var(--alltag-dim); color:var(--alltag); border-radius:100px; padding:7px 12px; font-size:13px; font-weight:660; }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
.card.tight{ padding:13px 14px; }
.card-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.card-h h2{ font-size:14px; font-weight:660; margin:0; }
.card-h span{ font-size:12px; color:var(--text-faint); }
.muted{ color:var(--text-dim); font-size:13px; line-height:1.5; margin:0; }
.tiny{ font-size:11.5px; color:var(--text-faint); }
.sec-label{ font-size:12px; font-weight:660; color:var(--text-dim); margin:18px 2px 8px; }

.btn{ border:none; border-radius:12px; padding:13px 16px; font-size:15px; font-weight:620;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  transition:transform .06s ease, opacity .15s ease; }
.btn:active{ transform:scale(.975); }
.btn:disabled{ opacity:.4; }
.btn.primary{ background:var(--text); color:var(--bg); }
.btn.accent{ background:var(--zitate); color:#0f2420; }
.btn.secondary{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); }
.btn.ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--line); }
.btn.danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
.btn.block{ width:100%; }
.btn.sm{ padding:9px 12px; font-size:13px; border-radius:10px; }
.btn-row{ display:flex; gap:9px; }
.btn-row .btn{ flex:1; }
.icon{ width:17px; height:17px; display:block; flex:none; }

.hero{ background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
  border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:12px; }
.hero .kicker{ font-size:11.5px; font-weight:660; letter-spacing:.04em; text-transform:uppercase; color:var(--zitate); margin-bottom:6px; }
.hero h2{ font-size:20px; font-weight:660; margin:0 0 6px; letter-spacing:-.01em; }
.hero .meta{ font-size:13px; color:var(--text-dim); margin:0 0 14px; }

.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.chip{ font-size:12px; font-weight:620; padding:7px 12px; border-radius:100px; background:var(--panel-3); color:var(--text-dim); border:1px solid transparent; cursor:pointer; user-select:none; }
.chip.on{ background:var(--zitate-dim); color:var(--zitate); border-color:var(--zitate); }
.chip[data-cat="wissen"].on{ background:var(--wissen-dim); color:var(--wissen); border-color:var(--wissen); }
.chip[data-cat="alltag"].on{ background:var(--alltag-dim); color:var(--alltag); border-color:var(--alltag); }
.chip[data-cat="politik"].on{ background:var(--politik-dim); color:var(--politik); border-color:var(--politik); }
.chip[data-cat="wiki"].on{ background:var(--wiki-dim); color:var(--wiki); border-color:var(--wiki); }
.chip[data-cat="aktpolitik"].on{ background:var(--aktuell-dim); color:var(--aktuell); border-color:var(--aktuell); }
.chip[data-cat="raetsel"].on{ background:var(--raetsel-dim); color:var(--raetsel); border-color:var(--raetsel); }
.chip.scroll-row{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; }

.stat-row{ display:flex; gap:9px; margin-bottom:12px; }
.stat{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 10px; text-align:center; }
.stat b{ display:block; font-size:19px; font-weight:670; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat span{ display:block; font-size:11px; color:var(--text-faint); margin-top:3px; }

.badge{ display:inline-flex; align-items:center; font-size:11px; font-weight:660; padding:4px 9px; border-radius:100px; }
.badge.zitate{ background:var(--zitate-dim); color:var(--zitate); }
.badge.wissen{ background:var(--wissen-dim); color:var(--wissen); }
.badge.alltag{ background:var(--alltag-dim); color:var(--alltag); }
.badge.politik{ background:var(--politik-dim); color:var(--politik); }
.badge.wiki{ background:var(--wiki-dim); color:var(--wiki); }
.badge.aktpolitik{ background:var(--aktuell-dim); color:var(--aktuell); }
.badge.raetsel{ background:var(--raetsel-dim); color:var(--raetsel); }
.live-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--aktuell); margin-right:5px; animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

/* ---------- Fortschritt / Ziel ---------- */
.goal-bar{ height:8px; background:var(--panel-3); border-radius:100px; overflow:hidden; margin:10px 0 4px; }
.goal-bar i{ display:block; height:100%; background:var(--zitate); border-radius:100px; transition:width .25s ease; }
.goal-text{ font-size:12px; color:var(--text-dim); }

/* ---------- Dauer-Chips ---------- */
.dur-chip.on{ background:var(--zitate-dim); color:var(--zitate); border-color:var(--zitate); }

/* ---------- Rätsel-Reveal ---------- */
.reveal-btn{ margin-top:14px; background:var(--panel-2); border:1px dashed var(--line); color:var(--text-dim); border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
.solution-box{ margin-top:12px; padding:12px 14px; background:var(--raetsel-dim); border-radius:12px; color:var(--raetsel); font-size:14px; font-weight:600; display:none; }
.solution-box.show{ display:block; }

/* ---------- Feed-Aktionsleiste ---------- */
.feed-actions{ display:flex; gap:9px; margin-bottom:9px; }
.feed-actions .btn{ flex:1; }
.icon-btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); }
.icon-btn.on{ background:var(--raetsel-dim); color:var(--raetsel); border-color:var(--raetsel); }

/* ---------- Erfolge ---------- */
.badge-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.ach{ background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:12px 8px; text-align:center; opacity:.35; }
.ach.unlocked{ opacity:1; background:var(--zitate-dim); border-color:var(--zitate); }
.ach .em{ font-size:22px; display:block; margin-bottom:6px; }
.ach .lab{ font-size:10.5px; font-weight:660; line-height:1.25; }

/* ---------- Wochenchart ---------- */
.week-chart{ display:flex; align-items:flex-end; gap:7px; height:90px; margin-top:6px; }
.week-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
.week-bar{ width:100%; background:var(--zitate); border-radius:5px 5px 3px 3px; min-height:3px; }
.week-lab{ font-size:10px; color:var(--text-faint); font-weight:660; }

/* ---------- Suche ---------- */
.search-field{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; color:var(--text); margin-bottom:10px; }

/* ---------- Wissen-Liste ---------- */
.know-item{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; }
.know-item h3{ font-size:14.5px; font-weight:650; margin:8px 0 4px; }
.know-item p{ font-size:13px; color:var(--text-dim); margin:0; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* ---------- Feed-Overlay ---------- */
.feed-overlay{ position:fixed; inset:0; background:var(--bg); z-index:60; display:none; flex-direction:column; }
.feed-overlay.active{ display:flex; }
.feed-top{ display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 12px; }
.feed-close{ width:34px; height:34px; border-radius:100px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; }
.feed-body{ flex:1; display:flex; align-items:center; padding:0 20px; overflow-y:auto; }
.feed-card{ width:100%; background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:26px 22px; margin:auto 0; }
.feed-card .kicker{ font-size:11.5px; font-weight:660; letter-spacing:.04em; text-transform:uppercase; margin-bottom:12px; }
.feed-card h2{ font-size:21px; line-height:1.35; font-weight:640; letter-spacing:-.01em; margin:0 0 10px; }
.feed-card p{ font-size:15px; line-height:1.6; color:var(--text-dim); margin:0; }
.feed-card .author{ margin-top:14px; font-size:13px; color:var(--text-faint); }
.feed-bottom{ padding:16px; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px); }
.feed-progress{ text-align:center; font-size:12px; color:var(--text-faint); margin-bottom:10px; }

/* ---------- Quiz ---------- */
.quiz-opt{ display:block; width:100%; text-align:left; background:var(--panel); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:9px; font-size:14.5px; font-weight:560; color:var(--text); cursor:pointer; }
.quiz-opt.correct{ border-color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, var(--panel)); }
.quiz-opt.wrong{ border-color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, var(--panel)); }
.quiz-opt:disabled{ cursor:default; }
.quiz-progress{ height:5px; background:var(--panel-3); border-radius:100px; overflow:hidden; margin-bottom:16px; }
.quiz-progress i{ display:block; height:100%; background:var(--zitate); border-radius:100px; transition:width .2s ease; }

/* ---------- Kalender ---------- */
.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-nav b{ font-size:15px; font-weight:660; }
.nav-btn{ width:32px; height:32px; border-radius:100px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:16px; cursor:pointer; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal-dow{ text-align:center; font-size:10.5px; color:var(--text-faint); font-weight:660; padding-bottom:4px; }
.cal-day{ aspect-ratio:1; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600; color:var(--text-dim); background:var(--panel-2); cursor:pointer; border:1px solid transparent; }
.cal-day.empty{ visibility:hidden; }
.cal-day.today{ border-color:var(--text-faint); }
.cal-day.l1{ background:var(--zitate-dim); color:var(--zitate); }
.cal-day.l2{ background:color-mix(in srgb, var(--zitate) 45%, var(--zitate-dim)); color:#0f2420; }
.cal-day.l3{ background:var(--zitate); color:#0f2420; }

/* ---------- Sheet/Dialog ---------- */
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:70; display:none; }
.overlay.active{ display:block; }
.sheet{ position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--panel); border-radius:20px 20px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px); z-index:71; display:none; max-height:82dvh; overflow-y:auto; }
.sheet.active{ display:block; }
.sheet h2{ font-size:17px; font-weight:660; margin-bottom:10px; }
.sheet .grabber{ width:36px; height:4px; background:var(--line); border-radius:100px; margin:0 auto 14px; }
.mood-row{ display:flex; gap:8px; margin:10px 0 6px; }
.mood-btn{ flex:1; font-size:22px; padding:10px 0; border-radius:12px; background:var(--panel-2); border:1.5px solid var(--line); cursor:pointer; }
.mood-btn.on{ border-color:var(--zitate); background:var(--zitate-dim); }
.day-item{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
.day-item:last-child{ border-bottom:none; }

/* ---------- Settings ---------- */
.row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
.row:last-child{ border-bottom:none; }
.row .label{ font-size:14px; font-weight:560; }
.row .sub{ font-size:12px; color:var(--text-faint); margin-top:2px; }
.switch{ position:relative; width:46px; height:27px; flex:none; }
.switch input{ opacity:0; width:0; height:0; }
.switch span{ position:absolute; inset:0; background:var(--panel-3); border-radius:100px; transition:.15s; cursor:pointer; }
.switch span:before{ content:""; position:absolute; width:21px; height:21px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
.switch input:checked + span{ background:var(--zitate); }
.switch input:checked + span:before{ transform:translateX(19px); }
input[type="text"].field{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; color:var(--text); }

/* ---------- Nav ---------- */
.nav{ position:fixed; left:0; right:0; bottom:0; height:var(--nav-h); background:var(--panel);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:50; }
.nav-inner{ max-width:480px; margin:0 auto; height:100%; display:flex; }
.tab{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--text-faint); cursor:pointer; }
.tab span{ font-size:10.5px; font-weight:610; }
.tab.on{ color:var(--zitate); }

/* ---------- Navy (Zweitdesign) ---------- */
html[data-skin="navy"]{
  --bg:#0B132B; --panel:#1C2541; --panel-2:#22304F; --panel-3:#293A5C;
  --line:rgba(255,255,255,.06);
  --text:#F8FAFC; --text-dim:#94A3B8; --text-faint:#64748B;
  --zitate:#38BDF8; --zitate-dim:#0C2A3A;
  font-family: system-ui, -apple-system, "SF Pro Display", "Inter", sans-serif;
}
html[data-skin="navy"] p, html[data-skin="navy"] .muted{ line-height:1.65; }
html[data-skin="navy"] h1, html[data-skin="navy"] h2, html[data-skin="navy"] h3{ line-height:1.25; font-weight:700; letter-spacing:-.01em; }
html[data-skin="navy"] .card, html[data-skin="navy"] .stat, html[data-skin="navy"] .hero,
html[data-skin="navy"] .know-item, html[data-skin="navy"] .feed-card{
  border:1px solid rgba(255,255,255,.05); border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.25);
}
html[data-skin="navy"] .btn.accent{ background:#FFFFFF; color:#0B132B; font-weight:700; border-radius:9999px; box-shadow:0 10px 24px -8px rgba(0,0,0,.35); }
html[data-skin="navy"] .btn.secondary, html[data-skin="navy"] .btn.ghost{ border-radius:12px; border:1px solid rgba(255,255,255,.08); }
html[data-skin="navy"] .chip{ border-radius:9999px; }
html[data-skin="navy"] .nav{ background:rgba(28,37,65,.75); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid rgba(255,255,255,.06); }
html[data-skin="navy"] .hero{ background:linear-gradient(165deg, var(--panel-2) 0%, var(--panel) 60%); }
html[data-skin="navy"] .stat b{ font-weight:800; letter-spacing:-.02em; }
html[data-skin="navy"] .card-h{ padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,.05); }
html[data-skin="navy"][data-navy-panel="classic"]{ --panel:#1C2541; --panel-2:#22304F; --panel-3:#293A5C; }
html[data-skin="navy"][data-navy-panel="slate"]{ --panel:#1E293B; --panel-2:#263449; --panel-3:#2E3F58; }
html[data-skin="navy"][data-navy-panel="midnight"]{ --panel:#162447; --panel-2:#1C2D56; --panel-3:#223564; }
html[data-skin="navy"][data-navy-panel="steel"]{ --panel:#253355; --panel-2:#2D3D63; --panel-3:#354773; }
html[data-skin="navy"][data-navy-panel="charcoal"]{ --panel:#1A2333; --panel-2:#212C40; --panel-3:#28354D; }
.color-dots{ display:flex; gap:10px; flex-wrap:wrap; }
.color-dots button{ width:28px; height:28px; border-radius:50%; border:2px solid var(--line); padding:0; cursor:pointer; }
.color-dots button.on{ border-color:var(--text); box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--zitate); }
.seg{ display:inline-flex; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; }
.seg button{ border:none; background:none; color:var(--text-dim); font-size:12.5px; font-weight:610; padding:7px 12px; border-radius:8px; cursor:pointer; }
.seg button.on{ background:var(--panel-3); color:var(--text); }

/* ---------- Querformat ---------- */
@media (orientation:landscape) and (min-width:640px){
  .nav{ top:0; right:auto; bottom:0; width:var(--nav-w); border-top:none; border-right:1px solid var(--line); }
  .nav-inner{ max-width:none; height:100%; flex-direction:column; padding-top:calc(env(safe-area-inset-top,0px) + 16px); gap:6px; }
  .shell{ max-width:none; margin-left:var(--nav-w); padding-bottom:24px; }
  .screen{ max-width:640px; margin:0 auto; }
  .feed-body{ max-width:640px; margin:0 auto; width:100%; }
}
</style>
<!-- verbund-design:start -->
<script data-design="panel" data-sync="denkpause" src="../sg/design.js?v=3.4.1"></script>
<!-- verbund-design:end -->

<body>
<div class="shell" id="shell">

<!-- ============ ABLENKEN ============ -->
<div class="screen active" id="screen-ablenken" data-screen="ablenken"></div>

<!-- ============ WISSEN ============ -->
<div class="screen" id="screen-wissen" data-screen="wissen"></div>

<!-- ============ QUIZ ============ -->
<div class="screen" id="screen-quiz" data-screen="quiz"></div>

<!-- ============ KALENDER ============ -->
<div class="screen" id="screen-kalender" data-screen="kalender"></div>

<!-- ============ EINSTELLUNGEN ============ -->
<div class="screen" id="screen-einst" data-screen="einst"></div>

</div><!-- /shell -->

<nav class="nav"><div class="nav-inner" id="nav">
  <button class="tab on" data-t="ablenken">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8z"/></svg><span>Ablenken</span>
