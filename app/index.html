<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Planer</title>
<meta name="description" content="Kalender, Training, Mobility, Schule und mehr – eine App, läuft offline">
<link rel="manifest" href="../manifest.json">

<style>
/* Hülle der App: eine Navigation für alles. Unten (Tablet: links) fünf Ziele – Kalender, Training, Mobility, Schule, Mehr.
 * Oben Titel und Chips für die Unterpunkte. Die Bereiche selbst sind die bisherigen Seiten (ohne eigene Leisten),
 * sie bleiben geladen und wechseln dadurch sofort. Farben aus dem gemeinsamen Design (Werte unten nur als Rückfall). */
:root { --bg: #131313; --s1: #202020; --s2: #272727; --s3: #2f2f2f; --line: #2c2c2c; --ink: #ebebea; --muted: #9b9a97; --faint: #6b6a67; --acc: #529cca; --accfg: #10151c;
  --c-training: #57c98d; --c-mobility: #ef7f93; --c-atmung: #ee8f5a; --c-schule: #4f8fe8; --c-notiz: #e0b34e; --c-aufgabe: #6aa6ff; --c-bibel: #d9a86c; --c-termin: var(--acc);
  /* in der APK setzt Android die Ränder als --safe-area-inset-* (Capacitor SystemBars), im Browser gilt env() */
  --top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); --bot: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; grid-template-areas: "top" "chips" "stage" "nav";
  /* fest am Bildschirm statt height:100dvh – Chrome auf Android liefert dvh nach Tastatur, Drehen oder App-Wechsel manchmal zu groß,
     dann rutscht die untere Leiste aus dem Bild */
  position: fixed; inset: 0; height: auto; overscroll-behavior: none; }
/* Behälter des Verbunds (Shadow-DOM, Inhalte schweben) darf keine Rasterzeile belegen */
body > #sg-shared-calendar { position: fixed; top: 0; left: 0; width: 0; height: 0; z-index: 2147483000; } /* fest = eigene Ebene: muss über allem liegen wie vorher */
/* Hinweise des Verbunds (Erinnerung, Woche planen, Sync) über der Leiste statt darauf */
@media (max-width: 899px) { body > #sg-shared-calendar { --sg-toast-bottom: calc(80px + var(--bot)); } }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
/* ---------- Kopf ---------- */
.top { grid-area: top; display: flex; align-items: center; gap: 4px; height: calc(58px + var(--top)); padding: var(--top) 8px 0 18px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { margin-left: -10px; }
.ib { width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; display: inline-flex; align-items: center; justify-content: center; flex: none; position: relative; }
.ib svg { width: 24px; height: 24px; }
.ib:active, .ib:hover { background: var(--s2); }
.ib .bd { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--acc); color: var(--accfg); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
/* ---------- Chips (Unterpunkte) ---------- */
.chips { grid-area: chips; min-width: 0; }
[hidden] { display: none !important; }
.crow { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
.crow::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 15px; border-radius: 18px; border: 1px solid var(--line); background: none; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: color-mix(in srgb, var(--c, var(--acc)) 22%, var(--s1)); color: var(--ink); border-color: transparent; }
.crow.sub { padding-top: 0; }
.crow.sub .chip { height: 32px; font-size: 13px; padding: 0 12px; border-radius: 10px; }
.crow.sub .chip.on { background: var(--s2); }
/* ---------- Inhalt ---------- */
#stage { grid-area: stage; position: relative; overflow: hidden; min-height: 0; border-top: 1px solid transparent; }
#stage.lined { border-top-color: var(--line); }
#stage > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); visibility: hidden; }
#stage > iframe.on { visibility: visible; }
.native { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 96px; display: none; }
.native.on { display: block; }
.load { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; }
.load.on { display: flex; }
.load i { width: 28px; height: 28px; border: 3px solid var(--s3); border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* ---------- Navigation (Material 3) ---------- */
.nav { grid-area: nav; display: flex; height: calc(68px + var(--bot)); padding: 0 4px var(--bot); background: var(--s1); border-top: 1px solid var(--line); }
.nav button { flex: 1; min-width: 0; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; position: relative; }
.nav .pill { width: 60px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
.nav svg { width: 24px; height: 24px; }
.nav button.on { color: var(--ink); }
.nav button.on .pill { background: color-mix(in srgb, var(--acc) 26%, transparent); }
.nav .bd { position: absolute; top: 8px; left: calc(50% + 10px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--acc); color: var(--accfg); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
@media (min-width: 900px) {
  body { grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto auto 1fr; grid-template-areas: "nav top" "nav chips" "nav stage"; }
  .nav { flex-direction: column; justify-content: flex-start; gap: 10px; height: auto; padding: calc(16px + var(--top)) 0 16px; border-top: 0; border-right: 1px solid var(--line); }
  .nav button { flex: none; height: 64px; }
  .nav { overflow-y: auto; scrollbar-width: none; }
  @media (max-height: 440px) { .nav { gap: 2px; padding-top: calc(8px + var(--top)); } .nav button { height: 56px; } }
  .native { padding: 8px 32px 40px; }
  .native > .wrap { max-width: 860px; margin: 0 auto; }
}
/* ---------- Bausteine ---------- */

.row .ic { width: 40px; height: 40px; border-radius: 13px; flex: none; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }

.row .val { color: var(--muted); font-size: 13px; flex: none; }
.btn { border: 0; border-radius: 22px; height: 44px; padding: 0 18px; background: var(--s2); font-weight: 600; font-size: 14.5px; }
.btn.p { background: var(--acc); color: var(--accfg); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1; min-width: 120px; }
.fab { position: absolute; right: 16px; bottom: 16px; width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--acc); color: var(--accfg); display: none; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 5; }
.fab.on { display: flex; }
.fab svg { width: 26px; height: 26px; }
.empty { color: var(--muted); padding: 18px 16px; text-align: center; font-size: 14.5px; }
/* ---------- Kalender ---------- */
/* ---------- Kalender-Startseite (Wochenleiste, Tagesplan, großer Monat) ---------- */
.calhd { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; min-height: 36px; }
.calhd b { flex: 1; font-size: 17px; font-weight: 650; }
.seg { display: inline-flex; background: var(--s1); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; height: 30px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--s3); color: var(--ink); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin: 0 0 14px; touch-action: pan-y; }
.wd { border: 0; background: none; border-radius: 14px; padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); }

.wd .n { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }
.glance { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
@media (min-width: 700px) { .glance { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
.glance .gl:last-child:nth-child(odd) { grid-column: 1 / -1; }
.gl { min-width: 0; border: 0; background: var(--s1); border-radius: 16px; padding: 10px 12px; text-align: left; display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 10px; align-items: center; }
.gl i { grid-row: 1 / 3; width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }

.go { flex: none; align-self: center; display: inline-flex; align-items: center; justify-content: center; line-height: 1; height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: color-mix(in srgb, var(--c) 22%, var(--s2)); color: var(--ink); font-size: 13px; font-weight: 700; }
.ck { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--faint); background: none; flex: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.ck svg { width: 14px; height: 14px; opacity: 0; }
.ck.on { background: var(--c-aufgabe); border-color: var(--c-aufgabe); color: var(--accfg); }
.ck.on svg { opacity: 1; }
#cal-month { margin: 6px 0 18px; }
.mhd { display: flex; align-items: center; gap: 4px; margin: 0 0 8px; }
.mhd .mt { flex: 1; border: 0; background: none; font-size: 17px; font-weight: 650; color: var(--ink); text-align: center; min-height: 44px; border-radius: 12px; }
.mhd .ib { width: 44px; height: 44px; border: 0; background: none; border-radius: 22px; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.mhd .ib svg { width: 22px; height: 22px; }
.mgrid { background: var(--s1); border-radius: 18px; padding: 6px 4px 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.mrow { display: grid; grid-template-columns: 22px repeat(7, minmax(0, 1fr)); gap: 2px; }
.mrow.mh span { text-align: center; font-size: 12px; font-weight: 650; color: var(--muted); padding: 4px 0 6px; }
.mrow .kw { font-size: 12px; color: var(--faint); display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; font-variant-numeric: tabular-nums; }
.mrow.mh .kw { padding-top: 4px; }
.mcell { display: block; min-width: 0; }
.mc { width: 100%; min-height: 68px; border: 0; background: none; border-radius: 12px; padding: 4px 2px 3px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); overflow: hidden; }
.mc .n { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.mc.we { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.mc.fr { background: color-mix(in srgb, var(--c-schule) 12%, transparent); }
.mc.o { opacity: .42; }
.mc.t .n { color: var(--acc); box-shadow: inset 0 0 0 2px var(--acc); }
.mc.s .n { background: var(--acc); color: var(--accfg); box-shadow: none; }
.mc:active { background: var(--s2); }
.mc .ms { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 0 3px; }
.mb { display: flex; align-items: center; gap: 2px; color: var(--c); min-width: 0; }
.mb svg { width: 10px; height: 10px; flex: none; stroke-width: 2.4; }
.mb i { flex: 1; height: 4px; border-radius: 2px; background: var(--c); min-width: 4px; }
.ml { display: flex; align-items: center; gap: 3px; color: var(--c); min-width: 0; font-size: 11px; line-height: 1.25; }
.ml svg { width: 11px; height: 11px; flex: none; stroke-width: 2.2; }

.ms .more { font-size: 12px; color: var(--muted); font-weight: 650; line-height: 1; text-align: center; }
.mgrid.wide .mc { min-height: 84px; align-items: stretch; }
.mgrid.wide .mc .n { align-self: center; }
.mgrid.sll { animation: sll .22s ease-out; } .mgrid.slr { animation: slr .22s ease-out; }

.mfoot { display: flex; justify-content: center; margin-top: 6px; }
.tomonth { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 12px); z-index: 6; border: 0; height: 44px; padding: 0 18px; border-radius: 22px; background: var(--s2); color: var(--ink); font-weight: 650; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }

.mpick .mpy { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 4px 16px 12px; }
.mpick .mpy b { font-size: 20px; min-width: 70px; text-align: center; }
.mpick .mpy .ib { width: 44px; height: 44px; border: 0; background: var(--s2); border-radius: 22px; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.mpick .mpy .ib svg { width: 22px; height: 22px; }
.mpick .mpm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 16px 8px; }
.mpick .mpm .chip { justify-content: center; height: 48px; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 4px 16px 12px; }
.legend .lg { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.legend .lg b { font-weight: 600; font-size: 14px; }
.legend .mb { width: 44px; }
.legend .mb svg { width: 14px; height: 14px; }
.lgbox { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex: none; }
.lgbox.t { color: var(--acc); box-shadow: inset 0 0 0 2px var(--acc); } .lgbox.s { background: var(--acc); color: var(--accfg); }
.lgbox.fr { border-radius: 8px; background: color-mix(in srgb, var(--c-schule) 18%, transparent); }
.legend .more { width: 30px; text-align: center; color: var(--muted); font-weight: 650; font-size: 12px; }
.next { margin-top: 4px; }
.nd { display: flex; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); }
.nd:first-child { border-top: 0; }
.nd .d { width: 46px; flex: none; font-weight: 650; font-size: 13.5px; }
.nd .d small { display: block; color: var(--muted); font-weight: 500; }
.nd .l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.nd .l span i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }

/* ---------- Blatt von unten, Hinweis ---------- */
.sheet { position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; }
.sheet.on { display: flex; animation: fade .15s; }

.sheet input[type=text], .sheet input[type=date], .sheet input[type=datetime-local], .sheet textarea { width: 100%; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 12px 14px; font-size: 16px; outline: none; color-scheme: dark; }

.qt { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 16px 6px; }
.snack { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--bot)); max-width: 560px; margin: 0 auto; z-index: 950; background: var(--ink); color: var(--bg); border-radius: 10px; min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; font-size: 14.5px; box-shadow: 0 4px 18px rgba(0,0,0,.35); transform: translateY(16px); opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s; }
.snack.on { transform: none; opacity: 1; pointer-events: auto; }
