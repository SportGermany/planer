<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planer</title>
<meta name="description" content="Planer: Kalender, Schule, Aufgaben und kluge Pausen in einer App.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planer">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Aufbau: links Seitenleiste (Mini-Monat, Kalender, Aufgaben), rechts die Ansicht.
   Auf dem Handy wird die Seitenleiste zur Schublade und unten erscheint eine Tab-Leiste. */
:root {
  --bg: #f3f1ec; --s1: #ffffff; --s2: #ebe8e1; --s3: #e1ddd5; --line: #dad5cb; --line2: #e8e4dc;
  --ink: #1d1c19; --muted: #67635b; --faint: #98938a; --acc: #2d4a6b; --accfg: #fff; --now: #d9412b; --warn: #b3261e;
  --font: 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, -apple-system, sans-serif;
  --hour: 48px; --gut: 52px; --side: 268px; --panel: 380px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --s1: #1c1b19; --s2: #252421; --s3: #2e2c29; --line: #353330; --line2: #262523;
    --ink: #ebe9e4; --muted: #a29e95; --faint: #6e6a62; --acc: #8fb0d9; --accfg: #10151c; --now: #ff6b55; --warn: #f0727c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --s1: #1c1b19; --s2: #252421; --s3: #2e2c29; --line: #353330; --line2: #262523;
  --ink: #ebe9e4; --muted: #a29e95; --faint: #6e6a62; --acc: #8fb0d9; --accfg: #10151c; --now: #ff6b55; --warn: #f0727c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; max-width: 100vw; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: flex; height: 100%; }

/* Seitenleiste */
.side { width: var(--side); flex: none; border-right: 1px solid var(--line); background: var(--bg); overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 14px 20px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; border: 0; background: none; color: var(--ink); padding: 6px 8px; margin: -6px -8px 0; border-radius: 10px; font-family: inherit; cursor: pointer; }
.brand:hover { background: var(--s2); }
.brand .bchev { color: var(--muted); font-size: 14px; margin-left: 2px; }
.brand svg { color: var(--acc); }
.nav { display: flex; flex-direction: column; gap: 1px; margin-top: -6px; }
.nav button { border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 9px; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: var(--ink); }
.nav .ni { width: 20px; height: 20px; display: flex; color: var(--acc); }
.nav .ni svg { width: 20px; height: 20px; }
.nav button:hover { background: var(--s2); }
.nav button.on { background: var(--s2); font-weight: 600; }
.nav .cnt { margin-left: auto; font-size: 12px; background: var(--now); color: #fff; border-radius: 9px; padding: 0 7px; line-height: 18px; }
.mini .mh { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.mini .mh button { border: 0; background: none; color: var(--muted); width: 28px; height: 28px; border-radius: 7px; font-size: 16px; }
.mini .mh button:hover { background: var(--s2); }
.mg { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; row-gap: 1px; }
.mg .w { color: var(--faint); padding: 2px 0; }
.mg button { border: 0; background: none; height: 28px; border-radius: 50%; font-variant-numeric: tabular-nums; position: relative; padding: 0; }
.mg button:hover { background: var(--s2); }
.mg button.o { color: var(--faint); }
.mg button.inr { background: var(--s2); border-radius: 0; }
.mg button.t { background: var(--now); color: #fff; border-radius: 50%; font-weight: 700; }
.mg button.has::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--muted); }
.wpstrip { flex: none; display: flex; align-items: center; gap: 12px; margin: 8px 12px 4px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--s1); }
.wpstrip.ok { border-color: color-mix(in srgb, var(--acc) 45%, var(--line)); }
.wpstrip .wpi { width: 32px; height: 32px; border-radius: 9px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
.wpstrip.ok .wpi { background: var(--acc); color: var(--accfg, #111); font-weight: 800; }
.wpstrip .wpt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wpstrip .wpt b { font-size: 14px; } .wpstrip .wpt small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.wpstrip .btn { white-space: nowrap; }
@media (max-width: 480px) { .wpstrip { margin: 6px 8px 2px; padding: 8px 10px; gap: 10px; } .wpstrip .wpx { display: none; } .wpstrip .wpi { width: 28px; height: 28px; } }
.wprem { display: flex; gap: 6px; margin: 4px 0; flex-wrap: wrap; } .wprem select { flex: 1 1 100%; min-width: 0; } .wprem input { flex: 1 1 100%; }
.sh { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.cals label, .opt { display: flex; align-items: center; gap: 9px; padding: 5px 4px; border-radius: 7px; font-size: 14px; cursor: pointer; }
.cals label:hover, .opt:hover { background: var(--s2); }
.cals input, .opt input { position: absolute; opacity: 0; pointer-events: none; }
.sw { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--c); background: var(--c); flex: none; }
input:not(:checked) + .sw { background: transparent; }
.side .tl { display: flex; flex-direction: column; gap: 2px; }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.link { border: 0; background: none; color: var(--muted); text-align: left; padding: 5px 4px; border-radius: 7px; font-size: 13px; }
.link:hover { background: var(--s2); color: var(--ink); }
.syncline.ok { color: #2f7d57; } .syncline.err { color: var(--warn); }
:root[data-theme="dark"] .syncline.ok { color: #6cc79a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .syncline.ok { color: #6cc79a; } }
select.small { border: 1px solid var(--line); background: var(--s1); border-radius: 7px; padding: 4px 6px; font-size: 13px; }

/* Hauptbereich */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.bar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: nowrap; }
.bar h1 { min-width: 0; font-size: 19px; margin: 0 6px 0 4px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar h1 small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
.bar .sp { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--s1); border-radius: 8px; padding: 6px 11px; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--s2); }
.btn.p { background: var(--acc); border-color: var(--acc); color: var(--accfg); font-weight: 600; }
.btn.d { color: var(--warn); }
.ib { border: 0; background: none; width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; flex: none; }
.ib:hover { background: var(--s2); color: var(--ink); }
.seg { display: flex; background: var(--s2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; white-space: nowrap; padding: 5px 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--s1); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.menu-btn { display: none; }
.vsel { border: 1px solid var(--line); background: var(--s1); border-radius: 8px; padding: 6px 6px; font-size: 14px; font-weight: 600; flex: none; }
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* Module (Schule = Lernplan, Pause = Denkpause) laufen als eigene Seiten im Planer */
#mods { flex: 1; min-height: 0; position: relative; }
#view[hidden], #mods[hidden], #mods iframe[hidden] { display: none !important; }
#mods iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.app.inmod .bar .back { display: inline-flex; }
.bar .back { display: none; }
.kbd { font: 12px/1 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; color: var(--muted); background: var(--s1); }

/* Zeitraster */
.tg { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tg-head, .tg-ad { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tg-head { padding-right: var(--sbw, 0px); }
.tg-ad { padding-right: var(--sbw, 0px); max-height: 30%; overflow-y: auto; }
.dh { padding: 6px 4px 6px; text-align: center; cursor: pointer; border-left: 1px solid var(--line2); }
.dh .wd { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.dh .dn { display: inline-block; font-size: 20px; font-weight: 600; width: 34px; height: 34px; line-height: 34px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.dh.t .dn { background: var(--now); color: #fff; }
.dh.t .wd { color: var(--now); font-weight: 600; }
.gutlab { font-size: 11px; color: var(--faint); padding: 4px 6px 0 0; text-align: right; }
.ad { border-left: 1px solid var(--line2); padding: 3px 3px; display: flex; flex-direction: column; gap: 2px; min-height: 28px; }
.chip { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 6px; border-radius: 5px; background: var(--cb); color: var(--ink); border-left: 3px solid var(--c);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; min-height: 20px; }
.chip.task { background: var(--s1); border: 1px solid var(--line); border-left: 3px solid var(--c); }
.chip.task.done { text-decoration: line-through; color: var(--faint); }
.chip .cb { width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 3px; flex: none; }
.chip.task.done .cb { background: var(--muted); }
.tg-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; overscroll-behavior: contain; }
.tg-body { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); position: relative; height: calc(var(--hour) * 24); }
.hours { position: relative; }
.hours span { position: absolute; right: 6px; font-size: 11px; color: var(--faint); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line2);
  background-image: repeating-linear-gradient(to bottom, var(--line2) 0, var(--line2) 1px, transparent 1px, transparent var(--hour)); touch-action: pan-y; }
.col.we { background-color: color-mix(in srgb, var(--s2) 35%, transparent); }
.evb { position: absolute; border-radius: 6px; padding: 3px 6px; font-size: 12px; line-height: 1.25; overflow: hidden; cursor: pointer;
  background: var(--cb); border-left: 3px solid var(--c); color: var(--ink); box-shadow: 0 0 0 1px var(--bg); user-select: none; -webkit-user-select: none; }
.evb b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evb span { color: var(--muted); font-variant-numeric: tabular-nums; }
.evb.past { opacity: .62; }
.evb.short { padding-top: 1px; } .evb.short b { display: inline; } .evb.short span { margin-left: 4px; }
.evb .rs { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
.evb.drag { opacity: .35; }
.evb.ghost { opacity: .9; box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 5; pointer-events: none; }
.evb.sel { box-shadow: 0 0 0 2px var(--acc); }
.nowl { position: absolute; left: -1px; right: 0; height: 2px; background: var(--now); z-index: 4; pointer-events: none; }
.nowl::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
.nowlab { position: absolute; right: 4px; font-size: 11px; font-weight: 700; color: var(--now); transform: translateY(-50%); background: var(--bg); padding: 0 2px; }

/* Monat */
.mo { flex: 1; display: grid; grid-template-rows: auto repeat(var(--rows), 1fr); min-height: 0; }
.mo-h, .mo-r { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mo-h div { font-size: 12px; text-transform: uppercase; color: var(--muted); padding: 6px 8px; letter-spacing: .04em; }
.mo-r { border-top: 1px solid var(--line); min-height: 0; }
.mc { border-left: 1px solid var(--line2); padding: 3px 4px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-height: 0; }
.mc:first-child { border-left: 0; }
.mc.o { background: color-mix(in srgb, var(--s2) 45%, transparent); }
.mc .n { font-size: 13px; font-weight: 600; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.mc.o .n { color: var(--faint); }
.mc.t .n { background: var(--now); color: #fff; }
.mc .more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.mc .chip { font-size: 11.5px; }

/* Listen (Agenda, Briefing, Aufgaben) */
.page { flex: 1; overflow-y: auto; padding: 22px 24px 120px; }
.page-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 1100px) {
  .page-in.dash { max-width: 1240px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .page-in.dash > .hello, .page-in.dash > .summary, .page-in.dash > .qa { grid-column: 1 / -1; }
  .page-in.dash > .hello { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .page-in.dash .grid2 { display: contents; }
  .page-in.dash > .card.wide { grid-column: span 2; }
}
@media (min-width: 761px) and (max-width: 1099px) { .page-in { max-width: 900px; } }
.hello h2 { font-size: 30px; margin: 0; letter-spacing: -.025em; font-weight: 750; }
.hello p { margin: 4px 0 0; color: var(--muted); }
.summary { font-size: 16px; line-height: 1.5; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 6px 20px rgba(0,0,0,.12); }
.card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 .sp { flex: 1; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.next { display: flex; gap: 14px; align-items: center; }
.next .when { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.next .what { font-size: 17px; font-weight: 600; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 9px 8px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.row:hover { background: var(--s2); }
.row .tm { width: 92px; flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.row .bar2 { width: 3px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.row .tt { font-weight: 600; }
.row .sub { font-size: 13px; color: var(--muted); }
.row.past { opacity: .55; }
.row.nowrow .tm { color: var(--now); font-weight: 700; }
.free { display: flex; flex-wrap: wrap; gap: 6px; }
.free span { background: var(--s2); border-radius: 7px; padding: 4px 9px; font-size: 13px; font-variant-numeric: tabular-nums; }
.week7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.week7 button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 4px; text-align: center; }
.week7 button.t { border-color: var(--now); }
.week7 b { display: block; font-size: 18px; }
.week7 small { color: var(--muted); font-size: 11px; display: block; }
.week7 i { display: flex; gap: 2px; justify-content: center; margin-top: 4px; min-height: 5px; }
.week7 i em { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.ag-day { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line2); }
.ag-day .d { width: 64px; flex: none; text-align: center; cursor: pointer; }
.ag-day .d b { display: block; font-size: 24px; line-height: 1.1; }
.ag-day .d small { color: var(--muted); font-size: 12px; text-transform: uppercase; }
.ag-day.t .d b, .ag-day.t .d small { color: var(--now); }
.ag-day .l { flex: 1; min-width: 0; }

.task { display: flex; gap: 11px; align-items: flex-start; padding: 8px 6px; border-radius: 8px; }
.task:hover { background: var(--s2); }
.task .ck { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 50%; background: none; flex: none; padding: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 12px; }
.task .ck:hover { border-color: var(--acc); color: var(--muted); }
.task.done .ck { background: var(--muted); border-color: var(--muted); color: var(--bg); }
.task .bd { flex: 1; min-width: 0; cursor: pointer; }
.task .tt { font-weight: 500; }
.task.done .tt { text-decoration: line-through; color: var(--faint); }
.task .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 2px; }
.task .meta .late { color: var(--warn); font-weight: 600; }
.task .meta .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 4px; }
.task .flag { color: var(--warn); font-weight: 700; }
/* Heute: gruppierte Listen */
.brief2 { max-width: 1080px; margin: 0 auto; padding: 0 2px 28px; }
.brief2 .lt { padding: 6px 4px 14px; }
.brief2 .eyebrow { margin: 0 0 2px; font-size: 13px; color: var(--muted); }
.brief2 .lt h1 { margin: 0; font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; }
.brief2 .sum { margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: var(--muted); max-width: 60ch; }
.brief2 .qa { margin: 0 0 14px; } .brief2 .qa-prev:empty { display: none; }
.brief2 .cols { display: block; }
@media (min-width: 760px) { .brief2 { padding: 4px 12px 32px; } .brief2 .lt h1 { font-size: 34px; } .brief2 .cols { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 0 28px; align-items: start; } }
.grp { margin: 0 0 24px; }
.grp > header { display: flex; align-items: baseline; gap: 14px; margin: 0 16px 7px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.grp > header span { flex: 1; }
.grp .lnk { border: 0; background: none; padding: 0; color: var(--acc); font-size: 14.5px; font-weight: 500; }
.cells { background: var(--s1); border-radius: 14px; overflow: hidden; }
.cells > * { position: relative; }
.cells > * + *::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
.cells > .nrow + .nrow::before { left: 58px; }
.gfoot { margin: 7px 16px 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.emptyc { padding: 14px 16px; color: var(--muted); font-size: 15px; }
.nrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 9px 14px 9px 16px; border: 0; background: none; color: inherit; text-decoration: none; text-align: left; font: inherit; cursor: pointer; }
.nrow:active { background: var(--s2); }
.nrow .ic { width: 30px; height: 30px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
.nrow .ic svg { width: 18px; height: 18px; }
.nrow .tx { flex: 1; min-width: 0; }
.nrow .tx b, .nextc .tx b { display: block; font-size: 15.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nrow .tx small, .nextc .tx small { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nrow .okm { color: #30d158; font-weight: 700; }

<script>

var LP_KEY = "schulkalender-bayern-v1", LP_URL = "#schule", TB_URL = "training/";

/* ---------- Wochenplanung im großen Kalender ---------- */
function wpOn() { return !!(C.weekPlanConfig && C.weekPlanConfig().on); }
// Woche, die gerade angezeigt wird (im Monat: die Woche des gewählten Tags), frühestens diese Woche

  if (done) { n = C.list().filter(function (e) { return e.wp === m; }).length; var pp = jsonKey("pulsplan.v1"); if (pp && pp.entries) n += pp.entries.filter(function (e) { return e.wp === m; }).length; }
  return "<div class='wpstrip" + (done ? " ok" : "") + "'><span class='wpi'>" + (done ? "✓" : "🗓") + "</span><span class='wpt'><b>KW " + kw(m) + (m === monday(today()) ? " · diese Woche" : m === addDays(monday(today()), 7) ? " · nächste Woche" : "") + "</b>" +
    "<small>" + (done ? "Geplant · " + n + " Einträge<span class='wpx'> aus der Wochenplanung</span>" : "Noch nicht geplant<span class='wpx'>: Training, Mobility, Atmung und Lernen in 2 Minuten</span>") + "</small></span>" +

}

/* ---------- Zeitraster (Tag, 3 Tage, Woche) ---------- */
function layoutDay(evs) {
  // Überlappende Termine nebeneinander legen: Gruppen bilden, darin Spalten vergeben.
  var items = evs.map(function (e) {
    var s = mins(e.time), en = mins(e.end);
    if (en == null || en <= s) en = Math.min(1440, s + 60);
    return { e: e, s: s, en: Math.max(en, s + 15) };
  }).sort(function (a, b) { return a.s - b.s || b.en - a.en; });
  var groups = [], cur = null, curEnd = -1;
  items.forEach(function (it) {
    if (!cur || it.s >= curEnd) { cur = []; groups.push(cur); curEnd = it.en; } else curEnd = Math.max(curEnd, it.en);
    cur.push(it);
  });
  groups.forEach(function (g) {
    var cols = [];
    g.forEach(function (it) {
      var c = cols.findIndex(function (end) { return end <= it.s; });
      if (c < 0) { c = cols.length; cols.push(0); }
      cols[c] = it.en; it.col = c;
    });
    g.forEach(function (it) { it.n = cols.length; });
  });
  return items;
}
function renderGrid(days) {
  var t = today(), nm = nowMin(), hour = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
  var evs = occ(days[0], days[days.length - 1], true);
  var h = "<div class='tg' style='--n:" + days.length + "'>";
  h += "<div class='tg-head'><div></div>" + days.map(function (k) {
    var d = parse(k);
    return "<div class='dh" + (k === t ? " t" : "") + "' data-day='" + k + "' data-v='1'><span class='wd'>" + WDS[d.getDay()] + "</span><span class='dn'>" + d.getDate() + "</span></div>";
  }).join("") + "</div>";
  var anyAd = days.some(function (k) { return evs.some(function (e) { return e.date === k && !e.time; }) || tasksOn(k).length; });
  h += "<div class='tg-ad'><div class='gutlab'>" + (anyAd ? "ganzt." : "") + "</div>" + days.map(function (k) {
    return "<div class='ad' data-adday='" + k + "'>" + evs.filter(function (e) { return e.date === k && !e.time; }).map(chip).join("") + tasksOn(k).map(taskChip).join("") + "</div>";
  }).join("") + "</div>";
  h += "<div class='tg-scroll' id='tgs'><div class='tg-body'><div class='hours'>";
  for (var i = 1; i < 24; i++) h += "<span style='top:" + i * hour + "px'>" + pad(i) + ":00</span>";
  h += "</div>";
  days.forEach(function (k) {
    var wd = parse(k).getDay();
    h += "<div class='col" + (wd === 0 || wd === 6 ? " we" : "") + "' data-col='" + k + "'>";
    layoutDay(evs.filter(function (e) { return e.date === k && e.time; })).forEach(function (it) {
      var top = it.s / 60 * hour, ht = Math.max((it.en - it.s) / 60 * hour - 2, 16), w = 100 / it.n;
      var past = k < t || (k === t && it.en < nm);
      var shortCls = ht < 34 ? " short" : "";
      h += "<div class='evb" + (past ? " past" : "") + shortCls + (S.sel === it.e.id + k ? " sel" : "") + "' data-ev='" + esc(it.e.id) + "' data-date='" + k + "' style='" + styleVars(it.e) +
        ";top:" + top + "px;height:" + ht + "px;left:calc(" + it.col * w + "% + 1px);width:calc(" + w + "% - 3px)'><b>" + esc(it.e.title) + "</b><span>" + esc(it.e.time) +
        (it.e.end ? "–" + esc(it.e.end) : "") + "</span><i class='rs'></i></div>";
    });
    if (k === t) h += "<div class='nowl' style='top:" + nm / 60 * hour + "px'></div>";
    h += "</div>";
  });
  h += "</div></div></div>";
  return h;
}
function chip(e) {
  return "<div class='chip' data-ev='" + esc(e.id) + "' data-date='" + e.date + "' style='" + styleVars(e) + "'>" + (e.time ? "<span class='tmc'>" + esc(e.time) + "</span> " : "") + esc(e.title) + "</div>";
}
function taskChip(t) {
  return "<div class='chip task" + (t.done ? " done" : "") + "' data-task='" + esc(t.id) + "' style='--c:" + colorT(t) + "'><span class='cb' data-check='" + esc(t.id) + "'></span>" + esc(t.title) + "</div>";
}

/* ---------- Monat ---------- */
function renderMonth() {
  var r = range(), t = today(), mo = parse(S.anchor).getMonth();
  var evs = occ(r[0], r[1]);
  var rows = parse(addDays(r[0], 35)).getMonth() === mo ? 6 : 5;
  var h = "<div class='mo' style='--rows:" + rows + "'><div class='mo-h'>" + ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(function (w) { return "<div>" + w + "</div>"; }).join("") + "</div>";
  var maxChips = innerHeight < 700 ? 2 : 3;
  for (var w = 0; w < rows; w++) {
    h += "<div class='mo-r'>";
    for (var i = 0; i < 7; i++) {
      var k = addDays(r[0], w * 7 + i), d = parse(k);
      var list = evs.filter(function (e) { return e.date === k; }), tl = tasksOn(k).filter(function (x) { return !x.done; });
      var all = list.map(chip).concat(tl.map(taskChip));
      h += "<div class='mc" + (d.getMonth() !== mo ? " o" : "") + (k === t ? " t" : "") + "' data-mday='" + k + "'><span class='n'>" + d.getDate() + "</span>" +
        all.slice(0, maxChips).join("") + (all.length > maxChips ? "<span class='more'>+" + (all.length - maxChips) + " weitere</span>" : "") + "</div>";
    }
    h += "</div>";
  }
  return h + "</div>";
}

/* ---------- Agenda ---------- */
function evRow(e, showDay) {
  var t = today(), nm = nowMin(), s = mins(e.time), en = mins(e.end);
  var past = e.date < t || (e.date === t && e.time && (en != null ? en : s + 60) < nm);
  var isNow = e.date === t && e.time && s <= nm && (en != null ? en : s + 60) > nm;
  var tm = e.time ? e.time + (e.end ? "–" + e.end : "") : "ganztägig";
  return "<div class='row" + (past ? " past" : "") + (isNow ? " nowrow" : "") + "' data-ev='" + esc(e.id) + "' data-date='" + e.date + "' style='--c:" + colorT(e) + "'><span class='tm'>" +
    (showDay ? rel(e.date) + "<br>" : "") + (isNow ? "jetzt · " + esc(e.end || "") : esc(tm)) + "</span><span class='bar2'></span><span><div class='tt'>" + esc(e.title) + "</div><div class='sub'>" + esc(e.app) +
    (e.rep && e.rep.f ? " · wiederholt sich" : "") + (e.note ? " · " + esc(e.note.split("\n")[0].slice(0, 80)) : "") + "</div></span></div>";
}
function renderAgenda() {
  var r = range(), t = today(), evs = occ(r[0], r[1]);
  var h = "<div class='page'><div class='page-in'>", any = false;
  for (var i = 0; i < 60; i++) {
    var k = addDays(r[0], i), list = evs.filter(function (e) { return e.date === k; }), tl = tasksOn(k);
    if (!list.length && !tl.length && k !== t) continue;
    any = true;
    var d = parse(k);
    h += "<div class='ag-day" + (k === t ? " t" : "") + "'><div class='d' data-day='" + k + "' data-v='1'><small>" + WDS[d.getDay()] + "</small><b>" + d.getDate() + "</b><small>" + MS[d.getMonth()] + "</small></div><div class='l'>" +
      (list.length || tl.length ? list.map(function (e) { return evRow(e); }).join("") + tl.map(taskRow).join("") : "<div class='empty'>Nichts geplant.</div>") + "</div></div>";
  }
  if (!any) h += "<div class='empty'>In den nächsten 60 Tagen ist nichts geplant.</div>";
  return h + "</div></div>";
}

/* ---------- Aufgaben ---------- */
function taskRow(t) {
  var td = today(), late = t.due && t.due < td && !t.done, own = !/^hw-/.test(t.id);
  return "<div class='task" + (t.done ? " done" : "") + (t.prio ? " prio" : "") + "' style='--c:" + colorT(t) + "'><button class='ck' data-check='" + esc(t.id) + "' aria-label='Erledigt'>✓</button><div class='bd' data-task='" + esc(t.id) + "'>" +
    "<div class='tt'>" + esc(t.title) + "</div><div class='meta'>" +
    (t.due ? "<span class='" + (late ? "late" : "") + "'>" + (late ? "überfällig · " : "") + rel(t.due) + "</span>" : "") +
    "<span><span class='dot'></span>" + esc(t.app === "Lernplan" ? "Schule" : t.app) + "</span>" + (t.note ? "<span class='nt'>" + esc(t.note.split("\n")[0].slice(0, 60)) + "</span>" : "") + "</div></div>" +
    (own && !t.done ? "<button class='fl" + (t.prio ? " on" : "") + "' data-a='flag' data-v='" + esc(t.id) + "' aria-label='Wichtig'>⚑</button>" : "") + "</div>";
}
/* Aufgaben wie in Erinnerungen: intelligente Listen oben, darunter die Liste nach Datum gruppiert */
var TLISTS = [["today", "Heute", "#0a84ff", "◉"], ["planned", "Geplant", "#ff453a", "◷"], ["flag", "Wichtig", "#ff9f0a", "⚑"], ["all", "Alle", "#8e8e93", "≡"], ["done", "Erledigt", "#30d158", "✓"]];
function renderTasks() {
  var td = today(), all = tasksAll(), open = all.filter(function (t) { return !t.done; }), done = all.filter(function (t) { return t.done; });
  var L = S.tlist || "today", src = S.tsrc || "";
  var bySrc = function (list) { return src ? list.filter(function (t) { return t.app === src; }) : list; };
  var sets = {
    today: open.filter(function (t) { return t.due && t.due <= td; }),
    planned: open.filter(function (t) { return t.due; }),
    flag: open.filter(function (t) { return t.prio; }),
    all: open, done: done
  };
  var h = "<div class='page'><div class='page-in tasks2'>";
  h += "<div class='tl-grid'>" + TLISTS.map(function (l) {
    return "<button class='tl-tile" + (L === l[0] ? " on" : "") + "' data-a='tlist' data-v='" + l[0] + "' style='--c:" + l[2] + "'><span class='ic'>" + l[3] + "</span><b>" + bySrc(sets[l[0]]).length + "</b><span class='nm'>" + l[1] + "</span></button>";
  }).join("") + "</div>";
  var apps = [];
  all.forEach(function (t) { if (apps.indexOf(t.app) < 0) apps.push(t.app); });
  if (apps.length > 1) h += "<div class='tl-src'>" + [""].concat(apps).map(function (a) {
    return "<button class='" + (src === a ? "on" : "") + "' data-a='tsrc' data-v='" + esc(a) + "'>" + (a ? esc(a === "Lernplan" ? "Schule" : a) : "Alle Listen") + "</button>";
  }).join("") + "</div>";
  h += quickAdd("task");
  var list = bySrc(sets[L]), title = (TLISTS.find(function (l) { return l[0] === L; }) || TLISTS[0])[1];
  h += "<div class='card tl-list'><h2 class='tl-h'>" + title + "<span>" + list.length + "</span></h2>";
  if (L === "done") {
    h += list.length ? list.sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); }).slice(0, 80).map(taskRow).join("") + "<div style='margin-top:10px'><button class='btn' data-a='cleardone'>Erledigte entfernen</button></div>" : "<div class='empty'>Noch nichts erledigt.</div>";
  } else {
    var sort = function (a, b) { return (a.due || "9").localeCompare(b.due || "9") || (b.prio || 0) - (a.prio || 0); };
    var groups = L === "today" ? [["Überfällig", list.filter(function (t) { return t.due < td; })], ["Heute", list.filter(function (t) { return t.due === td; })]]
      : L === "flag" ? [["", list.slice().sort(sort)]]
      : [["Überfällig", list.filter(function (t) { return t.due && t.due < td; })], ["Heute", list.filter(function (t) { return t.due === td; })],
        ["Morgen", list.filter(function (t) { return t.due === addDays(td, 1); })],
        ["Diese und nächste Woche", list.filter(function (t) { return t.due > addDays(td, 1) && t.due <= addDays(monday(td), 13); })],

/* ---------- Ziehen im Zeitraster: anlegen, verschieben, Länge ändern ----------

    var s = mins(e.time), en = mins(e.end); if (en == null || en <= s) en = s + 60;
    st.mode = resize ? "resize" : "move"; st.ev = e; st.el = evb; st.occ = evb.dataset.date; st.s = s; st.en = en; st.offset = st.start.min - s;
    if (resize) st.armed = true;

  function mount() {
    if (host) return;
    host = document.createElement("div");
    host.id = "sg-shared-calendar";
    root = host.attachShadow({ mode: "open" });
    var st = document.createElement("style"); st.textContent = CSS; root.appendChild(st);
    var v = document.createElement("div"); v.className = "v"; root.appendChild(v);
    var fab = document.createElement("button");
    if (script && script.getAttribute("data-fab") === "off") fab.style.display = "none"; // die Kalender-App braucht den Knopf nicht
    fab.className = "fab"; fab.title = "Kalender & Apps"; fab.setAttribute("aria-label", "Kalender und Apps");
    fab.innerHTML = ICON + "<span class='dot' hidden></span>";
    v.appendChild(fab);
    var box = document.createElement("div"); box.className = "box"; v.appendChild(box);
    var toast = document.createElement("div"); toast.className = "tbox"; v.appendChild(toast);
    var ib = document.createElement("div"); ib.className = "ibox"; v.appendChild(ib);
    var wb = document.createElement("div"); wb.className = "wpbox"; v.appendChild(wb);
    var wt = document.createElement("div"); wt.className = "wptoast"; v.appendChild(wt);
    var pb = document.createElement("div"); pb.className = "palbox"; v.appendChild(pb);
    document.body.appendChild(host);
    placeFab(fab);
    dragFab(fab);
    // Der App-Wechsler oben ersetzt den Knopf am Rand (Kalender, Design und Sync stehen in den Befehlen)
    fab.style.display = "none";
    mountSwitcher();
    render();
  }

  // Handy: schmale Lasche am rechten Rand (verdeckt kaum Inhalt, nur senkrecht verschiebbar). Laptop: runder Knopf.
  function edge() { return window.innerWidth <= 760; }
  function placeFab(fab) {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(POS_KEY + ":" + APP) || "null"); } catch (e) {}
    fab.classList.toggle("edge", edge());
    var x = edge() ? window.innerWidth - 30 : p && p.x != null ? p.x : window.innerWidth - 66, y = p ? p.y : window.innerHeight * (edge() ? .58 : 1) - (edge() ? 0 : 150);
    if (edge()) { fab.style.left = x + "px"; fab.style.top = Math.max(60, Math.min(window.innerHeight - 140, y)) + "px"; return; }
    fab.style.left = Math.max(4, Math.min(window.innerWidth - 50, x)) + "px";
    fab.style.top = Math.max(4, Math.min(window.innerHeight - 50, y)) + "px";
  }
  // Der Knopf lässt sich verschieben, falls er in einer App etwas verdeckt (Position wird pro App gemerkt).
  function dragFab(fab) {
    var sx, sy, ox, oy, moved = false, down = false;
    fab.addEventListener("pointerdown", function (e) {
      down = true; moved = false; sx = e.clientX; sy = e.clientY; ox = fab.offsetLeft; oy = fab.offsetTop;
      try { fab.setPointerCapture(e.pointerId); } catch (_) {}
    });
    fab.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 8) return;
      moved = true;
      if (!edge()) fab.style.left = Math.max(4, Math.min(window.innerWidth - 50, ox + dx)) + "px";
      fab.style.top = Math.max(4, Math.min(window.innerHeight - 50, oy + dy)) + "px";
    });
    fab.addEventListener("pointerup", function () {
      if (!down) return; down = false;
      if (moved) try { localStorage.setItem(POS_KEY + ":" + APP, JSON.stringify({ x: edge() ? null : fab.offsetLeft, y: fab.offsetTop })); } catch (e) {}
    });
    fab.addEventListener("pointercancel", function () { down = false; });
    // Erst beim Klick öffnen: so landet der Tipp nicht zusätzlich auf dem Fenster, das sich gerade öffnet.
    fab.addEventListener("click", function () { if (moved) { moved = false; return; } openPanel(); });
    window.addEventListener("resize", function () { placeFab(fab); });
  }

  function openPanel(date, tab) {
    mount();
    var d = date ? parse(date) : new Date();
    state.sel = iso(d); state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    state.edit = null; state.tab = tab || "cal"; state.open = true;
    render();
  }
  function close() { state.open = false; state.edit = null; render(); }

  function render(bg) {
    if (!root) return;
    var vv = root.querySelector(".v"); vv.classList.add("dark"); vv.setAttribute("style", themeVars());
    var today = iso(new Date());
    renderToast();
    renderInstall();
    renderWpToast();
    var box = root.querySelector(".box");
    if (!state.open) { box.innerHTML = ""; return; }
    // Termine nur ausrollen, wenn das Fenster wirklich offen ist (spart bei jeder Änderung Rechenzeit)
    var all = occurrences(iso(new Date(Date.now() - 400 * 864e5)), iso(new Date(Date.now() + 800 * 864e5)));
    // Hintergrund-Updates (andere App, anderes Gerät) dürfen kein gerade ausgefülltes Formular überschreiben.
    if (bg && (state.edit || (state.tab === "sync" && !cfg().token))) return;
    var evs = state.filter ? all.filter(function (e) { return e.app === APP; }) : all;
    var h = "<div class='wrap'><div class='panel' role='dialog' aria-label='Kalender und Apps'>";
    if (state.edit) h += form(state.edit);
    else {
      h += "<div class='top'><div class='tabs' role='tablist'>" +
        [["cal", "Kalender"], ["apps", "Apps"], ["design", "Design"], ["sync", "Sync"]].map(function (t) {
          return "<button role='tab' data-tab='" + t[0] + "' class='" + (state.tab === t[0] ? "on" : "") + "'>" + t[1] + "</button>";
        }).join("") + "</div><button class='x' data-a='close' aria-label='Schließen'>✕</button></div>";
      h += state.tab === "apps" ? appsView() : state.tab === "sync" ? cloudView() : state.tab === "design" ? designView() : month(evs, today);
    }
    h += "</div></div>";
    box.innerHTML = h;
    bind(box);
  }

  /* ---------- Als App installieren (Chrome / Samsung Internet) ---------- */
  var IKEY = "sg-install-later:" + ME.id;
  function standalone() {
    try { return window.SGInstalled || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: minimal-ui)").matches || navigator.standalone === true; } catch (e) { return false; }
  }
  function installNow() {
    var e = window.SGInstallEvt;
    if (!e) { state.instHelp = true; openPanel(null, "apps"); return Promise.resolve(false); }
    window.SGInstallEvt = null;
    e.prompt();
    return e.userChoice.then(function (r) {
      if (r && r.outcome === "accepted") window.SGInstalled = true;
      render(true); return !!(r && r.outcome === "accepted");
    }).catch(function () { render(true); return false; });
  }
  window.SGInstall = {
    available: function () { return !!window.SGInstallEvt; },
    installed: standalone,
    prompt: installNow
  };
  function installHelp() {
    return "<ol class='txt'><li><b>Chrome:</b> oben rechts ⋮ → <b>„App installieren“</b> (oder „Zum Startbildschirm hinzufügen“ → „Installieren“).</li>" +
      "<li><b>Samsung Internet:</b> unten ≡ → <b>„Seite hinzufügen zu“</b> → „Apps-Bildschirm“.</li>" +
      "<li>Steht dort nur „Verknüpfung erstellen“: Seite einmal neu laden und kurz warten, dann erneut versuchen.</li></ol>";
  }
  function renderInstall() {
    var ib = root.querySelector(".ibox");
    var later = 0; try { later = +localStorage.getItem(IKEY) || 0; } catch (e) {}
    if (standalone() || !window.SGInstallEvt || state.open || wp || wpDue() || Date.now() - later < 7 * 864e5) { ib.innerHTML = ""; return; }
    ib.innerHTML = "<div class='toast inst'><span class='mono' style='background:" + ME.color + "'>" + esc(ME.name.charAt(0)) + "</span>" +
      "<div class='it'><b>" + esc(ME.name) + " als App installieren</b><small>Eigenes Symbol, startet schneller, läuft offline.</small></div>" +
      "<div class='ia'><button class='no' data-i='later'>Später</button><button class='go' data-i='go'>Installieren</button></div></div>";
    ib.querySelectorAll("[data-i]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.dataset.i === "go") installNow();
        else { try { localStorage.setItem(IKEY, String(Date.now())); } catch (e) {} renderInstall(); }
      });
    });
  }
  window.addEventListener("sg-install", function () { if (root) render(true); });

  function renderToast() {
    var tb = root.querySelector(".tbox"), mp = myPending(), p = mp && mp[1], MYDATA = mp && mp[0];
    if (!p) { tb.innerHTML = ""; return; }
    var who = p.remote.device ? " (" + esc(p.remote.device) + ")" : "";
    tb.innerHTML = p.kind === "reload"
      ? "<div class='toast'><span>Die Daten dieser App wurden gerade vom Sync aktualisiert.</span><button data-t='reload'>Neu laden</button></div>"
      : p.kind === "conflict"
      ? "<div class='toast'><span>Deine Daten in " + esc(MYDATA.name) + " wurden hier und auf einem anderen Gerät" + who + " geändert. Welche Fassung soll gelten?</span><button data-t='mine'>Diese hier</button><button data-t='theirs'>Die andere</button></div>"
      : "<div class='toast'><span>Neue Daten von einem anderen Gerät" + who + ".</span><button data-t='theirs'>Jetzt laden</button></div>";
    tb.querySelectorAll("[data-t]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.dataset.t === "reload") location.reload();
        else if (b.dataset.t === "theirs") { applyRemote(MYDATA, p.remote); location.reload(); }
        else { setMeta(MYDATA.id, { hash: "", remote: p.remote.changed }); delete pending[MYDATA.id]; renderToast(); syncNow(); }
      });
    });
  }

  function month(evs, today) {
    var m = state.month, y = m.getFullYear(), mo = m.getMonth();
    var byDay = {};
    evs.forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
    var h = "<div class='hd'><h2>" + MON[mo] + " " + y + "</h2><button class='b' data-a='prev' aria-label='Voriger Monat'>‹</button>" +
      "<button class='b' data-a='today'>Heute</button><button class='b' data-a='next' aria-label='Nächster Monat'>›</button></div>";
    h += "<div class='grid'>" + WD.map(function (w) { return "<div class='wd'>" + w + "</div>"; }).join("");
    var start = new Date(y, mo, 1 - ((m.getDay() + 6) % 7));
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = iso(d);
      if (i === 35 && d.getMonth() !== mo) break;
      var cls = "c" + (d.getMonth() !== mo ? " o" : "") + (k === today ? " t" : "") + (k === state.sel ? " s" : "");
      var dots = (byDay[k] || []).slice(0, 4).map(function (e) { return "<i style='background:" + colorOf(e) + "'></i>"; }).join("");
      h += "<div class='" + cls + "' data-day='" + k + "'><span class='n'>" + d.getDate() + "</span><span class='ds'>" + dots + "</span></div>";
    }
    h += "</div>";
    h += "<label class='chk'><input type='checkbox' data-a='filter'" + (state.filter ? " checked" : "") + "> Nur Termine aus „" + esc(APP) + "“</label>";
    var list = byDay[state.sel] || [];
    h += "<div class='sec'><div class='hd'><h3 style='flex:1;margin:0'>" + longDate(state.sel) + "</h3><button class='b p' data-a='new'>+ Termin</button></div>";
    h += list.length ? list.map(function (e) { return item(e); }).join("") : "<div class='empty'>Keine Termine an diesem Tag.</div>";
    h += "</div>";
    var tasks = live("todo").filter(function (t) { return !t.done && (t.due === state.sel || (state.sel === today && t.due && t.due < today)); });
    h += "<div class='sec'><h3>Aufgaben</h3>" + tasks.map(function (t) {
      return "<label class='task'><input type='checkbox' data-task='" + esc(t.id) + "'><span>" + esc(t.title) +
        (t.due < today ? " <em>überfällig</em>" : "") + "</span></label>";
    }).join("") + "<input class='qt' name='quicktask' placeholder='+ Aufgabe für diesen Tag' maxlength='120' enterkeyhint='done'></div>";
    var seen = {}; // Serien nur mit dem nächsten Termin zeigen
    var upcoming = evs.filter(function (e) { if (e.date <= state.sel || seen[e.id]) return false; seen[e.id] = 1; return true; }).slice(0, 5);
    if (upcoming.length) h += "<div class='sec'><h3>Danach</h3>" + upcoming.map(function (e) { return item(e, true); }).join("") + "</div>";
    if ("Notification" in window && Notification.permission === "default") h += "<div class='cl' data-a='notify'>Erinnerungen als Benachrichtigung erlauben</div>";
    h += "<div class='tools'><a class='b big' href='" + esc(appUrl(APPS[0]) + "#cal") + "'>Großer Kalender</a><button class='b' data-a='weekplan'>Woche planen</button><button class='b' data-a='export'>Sichern</button><button class='b' data-a='import'>Importieren</button><button class='b' data-a='ics'>.ics-Export</button></div>";
    return h;
  }

  function item(e, withDate) {
    var meta = [];
    if (withDate) meta.push(parse(e.date).getDate() + ". " + MON[parse(e.date).getMonth()]);
    if (e.time) meta.push(e.time + (e.end ? "–" + e.end : "") + " Uhr");
    meta.push(e.app);
    return "<div class='ev' data-id='" + esc(e.id) + "'><span class='bar' style='background:" + colorOf(e) + "'></span><div><div class='t'>" + esc(e.title) +
      "</div><div class='m'>" + esc(meta.join(" · ")) + "</div>" + (e.note ? "<div class='m'>" + esc(e.note) + "</div>" : "") + "</div></div>";
  }

  function appsView() {
    var here = location.hash;
    var h = "<div class='apps'>" + APPS.map(function (a) {
      var me = a.id === ME.id;
      return "<div class='app" + (me ? " me" : "") + "'><a class='ah' href='" + (me ? "#" : esc(appUrl(a))) + "'" + (me ? " data-a='close'" : "") + ">" +
        "<span class='mono' style='background:" + a.color + "'>" + esc(a.name.charAt(0)) + "</span><span><b>" + esc(a.name) + "</b><span>" + (me ? "Du bist hier" : esc(a.info)) + "</span></span></a>" +
        (a.sections.length ? "<div class='secs'>" + a.sections.map(function (sct) {
          return "<a href='" + esc(appUrl(a) + sct[1]) + "'" + (me ? " data-go='" + esc(sct[1]) + "'" : "") + ">" + esc(sct[0]) + "</a>"; }).join("") + "</div>" : "") +
        (me ? (standalone() ? "<div class='ok2'>✓ Als App installiert</div>" : "<button class='ib' data-a='install'>" + esc(a.name) + " als App installieren</button>" + (state.instHelp ? installHelp() : "")) : "") + "</div>";
    }).join("") + "</div>";
    h += "<p class='txt m'>Drei Apps, ein gemeinsamer Speicher: Termine, Aufgaben, Design und Sicherung gelten überall.</p>";
    return h;
  }
  function designView() {
    if (!window.SGTheme) return "<p class='txt'>Design nicht verfügbar.</p>";
    var cur = window.SGTheme.current().id;
    return "<p class='txt m'>Gilt sofort für alle Apps auf diesem Gerät – und mit Sync auch auf deinen anderen Geräten.</p>" +
      "<label class='chk' style='margin:0 0 12px'><input type='checkbox' data-a='glass'" + (window.SGTheme.glass && window.SGTheme.glass() ? " checked" : "") + "> Glaseffekt (durchscheinende Flächen, schwebende Leiste)</label><div class='themes'>" +
      window.SGTheme.list.map(function (t) {
        return "<button class='th" + (t.id === cur ? " on" : "") + "' data-theme='" + t.id + "' style='background:" + t.bg + ";color:" + t.ink + ";border-color:" + (t.id === cur ? t.acc : t.line) + "'>" +
          "<span class='pv'><i style='background:" + t.s1 + "'></i><i style='background:" + t.s2 + "'></i><i style='background:" + t.s3 + "'></i><i style='background:" + t.acc + "'></i></span>" +
          "<b>" + esc(t.name) + "</b><small style='color:" + t.muted + "'>" + esc(t.info) + "</small></button>";

  function ago(t) {

  // Alle Daten aller Apps in einem Objekt – für Datei-Sicherung und Wiederherstellung
  function allKeys() {
    var keys = [KEY, TKEY, "sg-design"];
    DATA.forEach(function (a) { keys = keys.concat(a.keys); });
    return keys;
  }
  function fullBackup() {
    var data = {};
    allKeys().forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) data[k] = v; });
    return { format: "sportgermany-sicherung", v: 1, created: new Date().toISOString(), device: deviceName(), data: data };
  }
  // Einen Stand übernehmen und dafür sorgen, dass er sich auch auf den anderen Geräten durchsetzt:
  // Termine/Aufgaben bekommen einen frischen Zeitstempel, was im Stand fehlt, wird als gelöscht markiert.
  function applySnapshot(data) {
    Object.keys(COLS).forEach(function (c) {
      var col = COLS[c], raw = data[col.key];
      if (raw == null) return;
      var snap; try { snap = JSON.parse(raw); } catch (e) { return; }
      var now = Date.now(), d = load(c), keep = {};
      (snap.events || []).forEach(function (e) { e.changed = now; keep[e.id] = 1; });
      d.events.forEach(function (e) { if (!keep[e.id] && !e.deleted) snap.events.push(Object.assign({}, e, { deleted: true, changed: now })); });
      save({ v: 1, events: snap.events }, false, c);
    });
    DATA.concat(EXTRA).forEach(function (a) {
      var touched = false;
      a.keys.forEach(function (k) { if (Object.prototype.hasOwnProperty.call(data, k)) { localStorage.setItem(k, data[k]); touched = true; } });
      if (touched) setMeta(a.id, { hash: "", remote: 0, force: true }); // gilt als lokal geändert und setzt sich durch
    });
  }
  function restoreVersion(ver, when) {
    var c = cfg();
    if (!confirm("Alle Apps auf den Stand vom " + when + " zurücksetzen? Neuere Änderungen gehen dabei verloren.")) return;
    state.hist = { loading: true }; render();
    gh("/gists/" + c.gist + "/" + ver, null, c.token).then(fullGist).then(function (g) {
      var data = {}, f = g.files || {};
      Object.keys(COLS).forEach(function (k) { var x = f[COLS[k].file]; if (x && x.content) data[COLS[k].key] = x.content; });
      DATA.concat(EXTRA).forEach(function (a) {
        var r = readJSON(f["app-" + a.id + ".json"]);
        if (r && r.data) Object.keys(r.data).forEach(function (k) { data[k] = r.data[k]; });
      });
      applySnapshot(data);
      return syncNow();
    }).then(function () { alert("Stand vom " + when + " wiederhergestellt."); location.reload(); })
      .catch(function (e) { state.hist = { error: e.message || "Wiederherstellen fehlgeschlagen." }; render(); });
  }
  function restoreFile() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = function () {
      var file = inp.files && inp.files[0]; if (!file) return;
      file.text().then(function (txt) {
        var b = JSON.parse(txt);
        if (!b || b.format !== "sportgermany-sicherung" || !b.data) throw new Error("format");
        if (!confirm("Sicherung vom " + new Date(b.created).toLocaleString("de-DE") + " einspielen? Die aktuellen Daten aller Apps werden ersetzt.")) return;
        applySnapshot(b.data);
        syncNow().then(function () { location.reload(); });
      }).catch(function () { alert("Diese Datei ist keine Gesamtsicherung der Apps."); });
    };
    inp.click();
  }
  function connect(token) {
    token = token.trim();
    if (!token) return;
    sync.busy = true; sync.error = ""; render();
    gh("/user", null, token).then(function (u) {
      return findOrCreateGist(token, load()).then(function (id) { return gh("/gists/" + id, null, token).then(function (g) { return [u, id, g]; }); });
    }).then(function (r) {
      var u = r[0], g = r[2];
      var hasData = Object.keys(g.files || {}).some(function (f) { return f.indexOf("app-") === 0; });
      setCfg({ token: token, user: u.login, gist: r[1] });
      sync.busy = false;
      // Termine und Aufgaben werden ohnehin zusammengeführt; bei den App-Daten entscheidet die Person einmal.
      sync.adopt = hasData && confirm("In deiner Cloud sind schon Daten von einem anderen Gerät gesichert.\n\nOK = diese Daten auf dieses Gerät übernehmen (empfohlen für ein neues Gerät)\nAbbrechen = die Daten dieses Geräts behalten und hochladen");
      if (hasData && !sync.adopt) DATA.concat(EXTRA).forEach(function (a) { if (a.keys.length) setMeta(a.id, { hash: "", remote: 0, force: true }); });
      return syncNow().then(function (ok) { sync.adopt = false; return ok; });
    }).catch(function (e) {
      sync.busy = false;
      sync.error = (e && e.message && !/fetch|network/i.test(e.message)) ? e.message : "Keine Verbindung zu GitHub.";

  }

  function bind(box) {
    box.querySelector(".wrap").addEventListener("click", function (ev) {
      if (ev.target.classList.contains("wrap")) { close(); return; }
      var t = ev.target.closest("[data-a],[data-day],[data-id],[data-tab],[data-theme],[data-ver],[data-go]");
      if (!t) return;
      if (t.dataset.go !== undefined) { close(); return; } // Bereich derselben App: Link setzt nur den #-Teil
      if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
      if (t.dataset.theme && window.SGTheme) { window.SGTheme.set(t.dataset.theme); render(); return; }
      if (t.dataset.ver) { restoreVersion(t.dataset.ver, t.dataset.when); return; }
      if (t.dataset.day) { state.sel = t.dataset.day; render(); return; }
      if (t.dataset.id && !t.dataset.a) {
        var e = live().find(function (x) { return x.id === t.dataset.id; }); // bei Serien: die ganze Serie
        if (e) { state.edit = Object.assign({}, e); render(); }
        return;
      }
      if (t.dataset.a === "close" && t.tagName === "A") ev.preventDefault();
      act(t.dataset.a, box);
    });
    box.querySelectorAll("[data-task]").forEach(function (cb) {
      cb.addEventListener("change", function () { api.tasks.update(cb.dataset.task, { done: cb.checked }); });
    });
    var qt = box.querySelector("[name=quicktask]");
    if (qt) qt.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && qt.value.trim()) { api.tasks.add({ title: qt.value.trim(), due: state.sel }); }
    });
    var f = box.querySelector("[data-a=filter]");
    if (f) f.addEventListener("change", function () { state.filter = f.checked; render(); });
    var ti = box.querySelector("input[name=title]");
    if (ti && state.edit && !state.edit.id) ti.focus();
  }

  function act(a, box) {
    var m = state.month;
    if (a === "prev") state.month = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    else if (a === "next") state.month = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    else if (a === "today") { var t = new Date(); state.sel = iso(t); state.month = new Date(t.getFullYear(), t.getMonth(), 1); }
    else if (a === "close") return close();
    else if (a === "weekplan") { close(); openWeekPlan(); return; }
    else if (a === "glass") { var gc = box.querySelector("[data-a=glass]"); if (window.SGTheme && window.SGTheme.setGlass) window.SGTheme.setGlass(gc.checked); return; }
    else if (a === "install") { if (window.SGInstallEvt) { close(); installNow(); } else { state.instHelp = true; render(); } return; }
    else if (a === "connect") return connect(box.querySelector("[name=token]").value);
    else if (a === "syncnow") return syncNow();
    else if (a === "notify") return askNotify();
    else if (a === "backup") return download("sportgermany-sicherung-" + iso(new Date()) + ".json", "application/json", JSON.stringify(fullBackup(), null, 1));
    else if (a === "restorefile") return restoreFile();
    else if (a === "history") { state.hist = { loading: true }; render(); loadHistory(); return; }
    else if (a === "histclose") state.hist = null;
    else if (a === "disconnect") {
      if (!confirm("Sync auf diesem Gerät beenden? Alle Daten bleiben hier und auf GitHub erhalten.")) return;
      setCfg(null); sync.error = ""; sync.last = 0;
    }
    else if (a === "new") state.edit = { date: state.sel, app: APP };
    else if (a === "back") state.edit = null;
    else if (a === "save") {
      var v = {};
      ["title", "date", "time", "end", "note", "color", "remind"].forEach(function (k) { v[k] = box.querySelector("[name=" + k + "]").value.trim(); });
      v.remind = v.remind === "" ? null : +v.remind;
      if (v.remind != null) askNotify();
      if (!v.title) { box.querySelector("[name=title]").focus(); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) { box.querySelector("[name=date]").focus(); return; }
      if (state.edit.id) api.update(state.edit.id, v); else api.add(v);
      state.sel = v.date; var d = parse(v.date); state.month = new Date(d.getFullYear(), d.getMonth(), 1);
      state.edit = null;
    }
    else if (a === "del") {
      if (!confirm("Termin „" + state.edit.title + "“ in allen Apps löschen?")) return;
      api.remove(state.edit.id); state.edit = null;
    }
    else if (a === "export") return download("gemeinsamer-kalender-" + iso(new Date()) + ".json", "application/json", JSON.stringify(load(), null, 2));
    else if (a === "import") return importFile();
    else if (a === "ics") return download("gemeinsamer-kalender.ics", "text/calendar", ics());
    render();
  }

  // Import führt zusammen: pro Termin gewinnt die zuletzt geänderte Fassung, nichts wird blind überschrieben.
  function importFile() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = function () {
      var file = inp.files && inp.files[0]; if (!file) return;
      file.text().then(function (txt) {
        var src = JSON.parse(txt);
        if (!src || !Array.isArray(src.events)) throw new Error("format");
        var added = mutate(function (d) { return mergeInto(d, src.events).added; });
        alert("Import fertig: " + added + " neue Termine.");
      }).catch(function () { alert("Diese Datei ist keine gültige Kalender-Sicherung."); });
    };
    inp.click();
  }

  function ics() {
    function f(s) { return String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/[,;]/g, "\\$&"); }
    function stamp(date, time) { return date.replace(/-/g, "") + "T" + time.replace(":", "") + "00"; }
    var out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//SportGermany//Gemeinsamer Kalender//DE"];
    live().forEach(function (e) {
      out.push("BEGIN:VEVENT", "UID:" + e.id + "@sportgermany", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z");
      if (e.time) {
        out.push("DTSTART:" + stamp(e.date, e.time));
        if (e.end) out.push("DTEND:" + stamp(e.date, e.end));
      } else {
        var n = parse(e.date); n.setDate(n.getDate() + 1);
        out.push("DTSTART;VALUE=DATE:" + e.date.replace(/-/g, ""), "DTEND;VALUE=DATE:" + iso(n).replace(/-/g, ""));
      }
      out.push("SUMMARY:" + f(e.title), "DESCRIPTION:" + f((e.note ? e.note + "\n" : "") + "aus " + e.app));
      if (e.rep && e.rep.f) out.push("RRULE:FREQ=" + { d: "DAILY", w: "WEEKLY", "2w": "WEEKLY;INTERVAL=2", m: "MONTHLY", y: "YEARLY" }[e.rep.f] + (e.rep.until ? ";UNTIL=" + e.rep.until.replace(/-/g, "") : ""));
      if (e.remind != null) out.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + f(e.title), "TRIGGER:-PT" + (+e.remind) + "M", "END:VALARM");
      out.push("END:VEVENT");
    });
    out.push("END:VCALENDAR");
    return out.join("\r\n");
  }

  /* ---------- Wochenplanung: Fragen zu Training, Mobility & Atmung, Lernen – Antworten werden direkt eingetragen ----------
   * Einstellungen und letzte Antworten liegen in sg-wochenplan-v1 (wird mit der Cloud-Sicherung abgeglichen).
   * Eingetragene Termine tragen wp = Montag der Woche; neu planen ersetzt sie. */
  var WP_KEY = "sg-wochenplan-v1", WDN = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"], WDL = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
  function wpDefaults() {
    var ws = jkey("wk_settings") || {}, pp = (jkey("pulsplan.v1") || {}).settings || {};
    var run = (ws.runDays || [0]).map(function (d) { return (d + 6) % 7; });
    var rest = (ws.restDays || []).map(function (d) { return (d + 6) % 7; });
    var train = [0, 2, 4].filter(function (d) { return run.indexOf(d) < 0 && rest.indexOf(d) < 0; });
    return { on: true, remind: "so", time: "18:00", topics: { training: true, mobility: true, lernen: true }, planned: {}, later: "",
      last: { train: { days: train, time: "17:00" }, run: { days: run, time: "10:00" }, mob: { days: [0, 1, 2, 3, 4, 5, 6], time: "07:30" },
        atm: { on: true, morning: pp.morning || "07:00", evening: pp.evening || "21:30" }, learn: { days: [0, 1, 2, 3], time: "16:00", dur: 45 } } };
  }
  function wpCfg() {
    var d = wpDefaults(), c = jkey(WP_KEY) || {};
    var out = Object.assign({}, d, c);
    out.topics = Object.assign({}, d.topics, c.topics || {});
    out.last = Object.assign({}, d.last, c.last || {});
    out.planned = Object.assign({}, c.planned || {});
    return out;
  }
  function wpSave(c) { try { localStorage.setItem(WP_KEY, JSON.stringify(c)); } catch (e) {} schedulePush(); emit(); }
  function mondayOf(k) { var d = parse(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); }
  function kw(k) { var d = parse(k), t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7); }
  function shortDate(k) { var d = parse(k); return d.getDate() + "." + (d.getMonth() + 1) + "."; }
  var WKINDS = ["Zirkeltraining", "Krafttraining", "Gym", "Laufen", "Radfahren", "Schwimmen", "Rodeln", "Mannschaftssport", "Yoga", "Sonstiges"];
  var WDURS = { train: [15, 20, 30, 45, 60, 75, 90, 120], run: [15, 20, 30, 45, 60, 75, 90, 120], mob: [5, 10, 15, 20, 30], learn: [20, 30, 45, 60, 90, 120] };
  var WDEF = { train: 45, run: 45, mob: 5, learn: 45 };
  // Einstellung eines Tages: eigene Werte dieses Wochentags, sonst die zuletzt benutzten
  function perOf(a, key, i) {
    var x = a[key] || {}, p = (x.per || {})[i] || {};
    return { time: p.time || x.time || "17:00", dur: +(p.dur || x.dur || WDEF[key]), kind: p.kind || x.kind || "Zirkeltraining", km: p.km != null ? p.km : (x.km || "") };
  }
  function durLabel(m) { return m < 60 ? m + " Min." : Math.floor(m / 60) + (m % 60 ? ":" + pad(m % 60) : "") + " Std."; }
  function unitFields(key, p) {
    var r = "";
