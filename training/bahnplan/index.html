<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131313">
<title>Bahnplan</title>
<meta name="description" content="Kurvenbuch für Rodelbahnen: Bahnplan mit Nummern und eigenen Notizen zu jeder Kurve">
<style>
/* Bahnplan – Kurvenbuch für Rodelbahnen. Farben kommen aus dem gemeinsamen Design (Variablen unten nur als Rückfall). */
:root { --bg: #131313; --s1: #202020; --s2: #272727; --s3: #2f2f2f; --line: #2c2c2c; --ink: #ebebea; --muted: #9b9a97; --faint: #6b6a67; --acc: #529cca; --accfg: #10151c;
  --neu: #8e8e93; --ueben: #ff9f0a; --sitzt: #30d158; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 1180px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 24px; }
.view { display: none; }
.view.on { display: block; }
h1 { font-size: 30px; line-height: 1.12; letter-spacing: -.022em; margin: 6px 4px 4px; font-weight: 700; }
.sub { color: var(--muted); margin: 0 4px 18px; font-size: 14.5px; }
.eyebrow { color: var(--muted); font-size: 13px; margin: 8px 4px 0; }
/* Gruppen wie in den Systemeinstellungen */
.grp { margin: 0 0 22px; }
.grp > header { display: flex; align-items: baseline; gap: 12px; margin: 0 16px 7px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.grp > header span { flex: 1; }
.lnk { border: 0; background: none; padding: 0; color: var(--acc); font-size: 14.5px; font-weight: 500; }
.cells { background: var(--s1); border-radius: 14px; overflow: hidden; }
.cells > * { position: relative; }
.cells > * + *::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
.gfoot { margin: 7px 16px 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 9px 14px 9px 16px; border: 0; background: none; text-align: left; }
.row:active { background: var(--s2); }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 500; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { color: var(--faint); font-size: 21px; }
.ic { width: 30px; height: 30px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
.empty { padding: 16px; color: var(--muted); }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; background: var(--s2); color: var(--ink); font-weight: 600; min-height: 44px; }
.btn.p { background: var(--acc); color: var(--accfg); }
.btn.sm { padding: 7px 12px; min-height: 36px; font-size: 14px; border-radius: 10px; }
.btn.d { color: #ff6961; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
/* Plan */
.planhead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.planhead .t { flex: 1; min-width: 220px; }
.seg { display: inline-flex; background: var(--s2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; min-height: 32px; }
.seg button.on { background: var(--s3); color: var(--ink); }
.progress { height: 6px; border-radius: 3px; background: var(--s2); overflow: hidden; display: flex; margin: 10px 4px 16px; }
.progress i { display: block; height: 100%; }
.plan { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.plan > *, .book > * { min-width: 0; }
@media (min-width: 860px) { .plan { grid-template-columns: minmax(0, 1.25fr) minmax(300px, .9fr); align-items: start; } .plan .mapcard { position: sticky; top: 12px; } }
.mapcard { background: var(--s1); border-radius: 14px; padding: 10px; }
.imgwrap { position: relative; border-radius: 10px; overflow: hidden; background: var(--s2); }
.imgwrap img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--bg); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.pin.sel { outline: 2px solid var(--ink); }
.placing { outline: 2px dashed var(--acc); outline-offset: -2px; cursor: crosshair; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 4px 0; }
.chips button { border: 1px solid var(--line); background: none; border-radius: 999px; min-width: 34px; height: 32px; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chips button.on { background: var(--acc); color: var(--accfg); border-color: var(--acc); }
.chips button.set { color: var(--ink); }
.crow .num { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; }
.crow .dirx { font-size: 12px; color: var(--muted); width: 54px; text-align: right; flex: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 0 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
/* Blatt (Kurve, Auswahl) */
.sheet { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(0,0,0,.45); }
.sheet.on { display: flex; justify-content: flex-end; }
.sheet .pane { width: 100%; max-width: 620px; height: 100%; overflow-y: auto; background: var(--bg); padding: calc(8px + env(safe-area-inset-top, 0px)) 16px calc(30px + env(safe-area-inset-bottom, 0px)); box-shadow: -20px 0 50px rgba(0,0,0,.4); }
.shead { position: sticky; top: calc(-8px - env(safe-area-inset-top, 0px)); z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 0; background: var(--bg); }
.shead h2 { flex: 1; margin: 0; font-size: 19px; font-weight: 700; text-align: center; }
.ib { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--s2); font-size: 18px; display: flex; align-items: center; justify-content: center; flex: none; }
.ib:disabled { opacity: .35; }
.field { padding: 10px 16px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.field label small { color: var(--faint); }
.field input, .field select, .field textarea { width: 100%; border: 0; background: transparent; outline: none; font-size: 16px; padding: 0; color: var(--ink); }
.field textarea { resize: none; min-height: 24px; line-height: 1.45; overflow: hidden; }
.field select { appearance: none; -webkit-appearance: none; }
.field input::placeholder, .field textarea::placeholder { color: var(--faint); }
.fieldrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; }
.fieldrow > label { font-size: 13px; color: var(--muted); width: 100%; }
.cue input { font-size: 19px; font-weight: 600; }
.drawbox { padding: 10px; }
.drawbox canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--s2); touch-action: none; }
.runs .run { display: flex; gap: 10px; padding: 10px 16px; align-items: flex-start; }
.runs .run b { font-size: 13px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.runs .run span { flex: 1; }
.runs .rate { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.runadd { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 10px 16px; align-items: center; }
.runadd textarea { grid-column: 1 / -1; width: 100%; border: 1px solid var(--line); background: var(--s2); border-radius: 10px; padding: 10px; min-height: 64px; resize: vertical; outline: none; }
.search { width: 100%; border: 0; border-radius: 10px; background: var(--s2); padding: 10px 12px; margin: 4px 0 16px; outline: none; font-size: 16px; }
/* Durchgehen (Visualisieren) */
.viz { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: none; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) 22px calc(20px + env(safe-area-inset-bottom, 0px)); }
.viz.on { display: flex; }
.viz .top { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.viz .top span { flex: 1; }
.viz .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 680px; margin: 0 auto; width: 100%; }
.viz .bign { font-size: 15px; color: var(--muted); }
.viz .bign b { font-size: 64px; color: var(--ink); display: block; line-height: 1; letter-spacing: -.03em; }
.viz .cuebig { font-size: 30px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.viz .pts { color: var(--muted); font-size: 16px; display: grid; gap: 6px; }
.viz .pts b { color: var(--ink); font-weight: 600; }
.viz .nav { display: flex; gap: 10px; max-width: 680px; margin: 0 auto; width: 100%; }
.viz .nav .btn { flex: 1; min-height: 54px; font-size: 16px; }
/* Buch */
.book .cv { background: var(--s1); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; break-inside: avoid; }
.book .cvh { display: flex; align-items: center; gap: 12px; }
.book .cvh .num { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.book .cvh b { font-size: 17px; }
.book .cvh small { display: block; color: var(--muted); font-size: 13px; }
.book .cue { font-size: 17px; font-weight: 600; margin: 10px 0 4px; }
.book dl { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 14.5px; }
.book dt { color: var(--muted); }
.book dd { margin: 0; white-space: pre-wrap; }
.book img { max-width: 260px; width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
@media (max-width: 520px) { .book dl { grid-template-columns: 1fr; } .book dt { margin-top: 6px; } }
.src { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 12px 16px; }
.src a { color: var(--acc); }
/* Leiste unten */
.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; z-index: 40; display: flex; height: 60px; padding: 0 6px; border-radius: 30px; background: var(--s1); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 28px rgba(0,0,0,.45); }
.tabs button { flex: 1; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; border-radius: 24px; margin: 5px 0; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--ink); background: rgba(255,255,255,.12); }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 80; display: none; }
.toast.on { display: block; }
.startbar .chips { padding: 4px 0 0; }
.startbar .chips button small { font-weight: 500; opacity: .75; margin-left: 2px; }
.startbar .chips button.more { border-style: dashed; }
.startrow { display: flex; gap: 10px; align-items: center; padding: 9px 16px; font-size: 13.5px; color: var(--muted); background: var(--s2); }
.startrow .flag { width: 30px; text-align: center; color: var(--acc); font-size: 13px; }
.startrow b { color: var(--ink); font-weight: 600; }
.crow.off { opacity: .45; }
.pin.off { opacity: .35; }
.own { font-style: normal; font-size: 11px; font-weight: 600; color: var(--acc); background: rgba(82,156,202,.14); border-radius: 6px; padding: 1px 6px; margin-left: 4px; vertical-align: 1px; }
.zz { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
.fassung { background: var(--s1); border-radius: 14px; padding: 10px 14px 12px; margin-bottom: 18px; font-size: 14px; color: var(--muted); }
.fassung .chips { padding: 0 0 8px; }
.fassung p { margin: 0 0 8px; }
.fassung b { color: var(--ink); }
.fassung.own { box-shadow: inset 3px 0 0 var(--acc); }
details.fold > summary { list-style: none; display: flex; align-items: center; gap: 8px; margin: 0 16px 7px; font-size: 13.5px; color: var(--muted); font-weight: 500; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "›"; display: inline-block; width: 10px; transition: transform .15s; font-size: 16px; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary span { flex: 1; }
details.fold > summary i { font-style: normal; font-size: 11.5px; background: var(--s2); color: var(--ink); border-radius: 9px; padding: 1px 7px; }
details.fold > summary em.all { font-style: normal; font-size: 11.5px; color: var(--faint); }
details.fold:not([open]) { margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.stats > div { background: var(--s1); border-radius: 14px; padding: 12px 14px; }
.stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12.5px; }
.delta { font-style: normal; font-size: 12px; color: #ff9f0a; margin-left: 4px; }
.best { font-style: normal; font-size: 12px; color: #30d158; margin-left: 4px; }
.plan.nomapcol { grid-template-columns: minmax(0, 1fr) !important; max-width: 760px; }
.imgwrap img { pointer-events: none; }
.nomap { padding: 22px 16px; text-align: center; color: var(--muted); }
.nomap b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.nomap p { margin: 0 auto 14px; max-width: 420px; font-size: 14px; }
.nomap .btns { justify-content: center; }
.placebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 4px 10px; font-size: 14px; }
.placebar span { flex: 1; min-width: 160px; }
.credit { font-size: 11.5px; color: var(--faint); margin: 8px 4px 0; line-height: 1.4; overflow-wrap: anywhere; }
.credit a { color: var(--muted); }
.crop { display: block; width: 100%; height: auto; background: #fff; border-radius: 10px; }
.drawbox { padding: 10px; }
.drawbox.on .crop { outline: 2px solid #e5383b; outline-offset: 2px; }
.tools .ib { width: 36px; height: 36px; }
.tools .sp, .maptools .sp { flex: 1; }
.seg.wrap { flex-wrap: wrap; }
.inp { border: 0; background: var(--s2); border-radius: 10px; padding: 8px 10px; font-size: 15px; color: var(--ink); min-height: 38px; }
.row.tog { cursor: pointer; }
.row.tog input { width: 22px; height: 22px; accent-color: var(--acc); }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.wimg { border: 0; background: var(--s1); border-radius: 12px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.wimg .wi { display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 8px; aspect-ratio: 1; overflow: hidden; }
.wimg img { max-width: 100%; max-height: 100%; }
.wimg b { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.wimg small { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.wimg.busy { opacity: .5; }
.sheet.wide .pane { max-width: 1100px; }
.zoombar { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; color: var(--muted); }
.zoomwrap { overflow: auto; border-radius: 10px; background: #fff; max-height: calc(100vh - 170px); }
.vizcrop { max-width: 520px; width: 100%; }
.book .cv.wcrop { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 560px) { .book .cv.wcrop { grid-template-columns: 1fr; } }
.cvimg .crop { border: 1px solid var(--line); }
.bookhead h1 { margin-top: 2px; }
.bmap { margin: 0 0 16px; background: var(--s1); border-radius: 14px; padding: 10px; }
.bmap .imgwrap { background: #fff; }
.tnotes { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; margin: 0 4px 16px; font-size: 14.5px; }
.tnotes dt { color: var(--muted); }
.tnotes dd { margin: 0; white-space: pre-wrap; }
.printopts { margin-bottom: 18px; }
.printopts .chips button.on { background: var(--acc); color: var(--accfg); border-color: var(--acc); }
.paper { border-top: 1px solid var(--line); padding-top: 14px; }
@media print {
  @page { size: A4; margin: 12mm; }
  :root { color-scheme: light !important; }
  html, body { background: #fff !important; color: #000 !important; padding: 0 !important; }
  .app { max-width: none; padding: 0; }
  .tabs, .noprint, .sheet, .viz, .toast, .sgappb, .appb, .appm, .sgpal { display: none !important; }
  .view { display: none !important; }
  #v-buch { display: block !important; }
  .paper { border: 0; padding: 0; }
  .bookhead h1 { font-size: 26pt; color: #000; }
  .bmap { background: none; padding: 0; break-after: auto; }
  .bmap .imgwrap { border: 1px solid #bbb; }
  .bmap img { max-height: 190mm; width: auto; max-width: 100%; margin: 0 auto; }
  .bmap .imgwrap { display: table; margin: 0 auto; }
  .pin { width: 22px; height: 22px; font-size: 10px; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .book .cv, .book .cvh .num { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .book .cv { background: none; border: 1px solid #bbb; break-inside: avoid; page-break-inside: avoid; }
  .book .cv.wcrop { grid-template-columns: 62mm 1fr; }
  .book dt, .book .cvh small, .sub, .eyebrow, .credit, .tnotes dt { color: #555 !important; }
  .book dd, .tnotes dd, .cue { color: #000; }
}
</style>
<!-- verbund-design:start -->
<script data-design="bahn" data-sync="bahnplan" src="../../sg/design.js?v=3.5.0"></script>
<!-- verbund-design:end -->
</head>
<body>
<div class="app">
  <!-- Bahnen -->
  <section class="view on" id="v-bahnen"></section>
  <!-- Plan einer Bahn -->
  <section class="view" id="v-plan"></section>
  <!-- Buch -->
  <!-- Läufe -->
  <section class="view" id="v-laeufe"></section>
  <section class="view" id="v-buch"></section>
</div>

<nav class="tabs" aria-label="Bahnplan">
  <button data-v="bahnen" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h16"/></svg>Bahnen</button>
  <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3c0 4 12 3 12 8s-12 3-12 8"/><circle cx="6" cy="3" r="1.4"/><circle cx="6" cy="19" r="1.4"/></svg>Plan</button>
  <button data-v="laeufe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4"/></svg>Läufe</button>
  <button data-v="buch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H19"/></svg>Buch</button>
</nav>

<div class="sheet" id="sheet"><div class="pane" id="sheetPane"></div></div>
<div class="viz" id="viz"></div>
<div class="toast" id="toast"></div>
<input type="file" id="imgIn" accept="image/*" hidden>

<script src="js/1-app.js?v=3.5.0"></script>
<!-- gemeinsamer-kalender:start -->
<script data-app="bahnplan" src="../../sg/verbund.js?v=3.5.0"></script>
<!-- gemeinsamer-kalender:end -->
</body>
</html>
