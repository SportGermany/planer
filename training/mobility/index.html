<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF0F2">
<meta name="description" content="Mobility-Training für Rennrodler: Tagestraining, Wettkampfprogramm, animierte Übungen.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<title>Mobility</title>
<style>
:root{
  --bg:#EAF0F2; --surface:#FFFFFF; --surface2:#F3F7F8; --ink:#0E1B24; --muted:#56666F; --line:#D3DDE2;
  --accent:#C8283A; --accent-ink:#FFFFFF; --accent-soft:#F7DDE0;
  --r-back:#1B6C8A; --r-hip:#A15A17; --r-leg:#3B7437; --r-warm:#6A7680; --r-start:#6A4C9C;
  --far:#A7B6BE; --floor:#B9C8CF; --mat:#DCE6EA;
  --shadow:0 1px 2px rgba(14,27,36,.06),0 8px 24px rgba(14,27,36,.06);
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#091218; --surface:#101D25; --surface2:#15252F; --ink:#E3ECF0; --muted:#8CA0AB; --line:#223540;
    --accent:#F2515F; --accent-ink:#1A0508; --accent-soft:#3A1A20;
    --r-back:#5DB3D3; --r-hip:#E1A061; --r-leg:#8CC47F; --r-warm:#9AA7B0; --r-start:#B7A0DE;
    --far:#48606D; --floor:#2C4350; --mat:#15262F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#091218; --surface:#101D25; --surface2:#15252F; --ink:#E3ECF0; --muted:#8CA0AB; --line:#223540;
  --accent:#F2515F; --accent-ink:#1A0508; --accent-soft:#3A1A20;
  --r-back:#5DB3D3; --r-hip:#E1A061; --r-leg:#8CC47F; --r-warm:#9AA7B0; --r-start:#B7A0DE;
  --far:#48606D; --floor:#2C4350; --mat:#15262F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px}
.brand{white-space:nowrap;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:14px}
.today{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px;padding-top:8px}

/* Heute */
.hero{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.rot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rot button{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:0}
.rot b{font-family:var(--fd);font-size:26px;line-height:1;font-weight:700}
.rot span{font-size:12px;color:var(--muted)}
.rot button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.rot button.on span{color:inherit;opacity:.75}
.rot button .done{font-size:11px}
.blk{font-family:var(--fd);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.meta{margin:0;color:var(--muted);font-size:14px}
.seg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg .lbl{font-size:13px;color:var(--muted)}
.seg .opts{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg .opts button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.seg .opts button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.start{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:16px;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.start svg{width:18px;height:18px}
.start small{font-family:var(--fb);font-weight:500;font-size:14px;letter-spacing:0;text-transform:none;opacity:.85;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 10px 8px 8px;border:1px solid var(--line)}
.row .th{width:64px;height:64px;border-radius:10px;background:var(--surface2);display:block}
.row .nm{font-weight:600;line-height:1.2}
.row .sub{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.row .main{border:0;background:none;text-align:left;padding:0;min-width:0}
.row .right{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.ibtn svg{width:18px;height:18px}
.note{font-size:14px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.note b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--fd);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Wettkampf */
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs2 button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.tabs2 button b{display:block;font-family:var(--fd);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.tabs2 button span{font-size:13px;color:var(--muted)}
.tabs2 button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.phase{display:flex;flex-direction:column;gap:8px}
.phase h3{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fd);font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.phase h3 span{font-family:var(--fb);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);font-variant-numeric:tabular-nums}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px;font-size:14px}
.warn svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:1px}

/* Übungen */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 0;min-width:0}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:4px}

/* Fortschritt */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--fd);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.card p{margin:0;font-size:14px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.has{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.cal .d.comp{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
form.test{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
form.test label{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
form.test input{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-variant-numeric:tabular-nums}
form.test button{align-self:flex-end;border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 16px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.entries li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.entries li:last-child{border-bottom:0}
.entries button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px}
.entries button.really{color:var(--accent);font-weight:600}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set span{font-size:15px}
.set small{display:block;color:var(--muted);font-size:13px}
.tog{width:48px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{transform:translateX(20px)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink);font-weight:600}
.tabbar button.on svg{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,16,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding-inline:16px;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet .grab{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;justify-content:space-between;align-items:center;padding-block:12px 8px;gap:10px}
.sheet h2{font-family:var(--fd);font-weight:700;font-size:30px;line-height:1.02;text-transform:uppercase}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage canvas{display:block;width:100%;height:260px}
.stage .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600}
.play svg{width:16px;height:16px}
.speed{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.ext{font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.stage .cap{position:absolute;left:10px;top:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sec{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.sec h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec p{margin:0;max-width:65ch}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--fd);font-weight:700;font-size:16px;width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.musc{display:flex;flex-wrap:wrap;gap:6px}
.musc .chip.p{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.mini b{display:block;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-bottom:2px}
.sled{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px}
.sled b{font-family:var(--fd);letter-spacing:.08em;text-transform:uppercase;font-size:13px;display:block;opacity:.7}

/* Player */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .ph{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;max-width:620px;width:100%;margin:0 auto}
.prog{flex:1;display:flex;gap:3px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.player .body{flex:1;display:flex;flex-direction:column;max-width:620px;width:100%;margin:0 auto;padding-inline:16px;min-height:0;gap:10px}
.pstage{flex:1;min-height:160px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pstage canvas{position:absolute;inset:0;width:100%;height:100%}
.side{position:absolute;top:12px;left:12px;font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:8px}
.flash{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--accent-ink);font-family:var(--fd);font-weight:700;font-size:40px;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.pinfo{display:flex;flex-direction:column;gap:2px}
.pinfo .k{font-family:var(--fd);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.pinfo h2{font-family:var(--fd);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase}
.pinfo p{margin:2px 0 0;color:var(--muted);font-size:15px}
.clock{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.clock .t{font-family:var(--fd);font-weight:700;font-size:84px;line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .t.prep{color:var(--muted)}
.clock .nx{font-size:13px;color:var(--muted);text-align:right;max-width:48%}
.clock .nx b{display:block;color:var(--ink);font-size:15px}
.tbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tbar b{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:22px;padding-block:6px 14px}
.ctrl button{border:1px solid var(--line);background:var(--surface);width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.ctrl button svg{width:22px;height:22px}
.ctrl .big{width:76px;height:76px;background:var(--ink);color:var(--bg);border:0}
.ctrl .big svg{width:28px;height:28px}
.fin{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:left}
.fin h2{font-family:var(--fd);font-weight:700;font-size:54px;line-height:.95;text-transform:uppercase}
.fin p{margin:0;color:var(--muted);font-size:16px;max-width:40ch}
.xbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.xbtn svg{width:18px;height:18px}
@media (max-width:380px){.blk{font-size:34px}.rot b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Android / 16:9 */
html{-webkit-tap-highlight-color:transparent}
body{margin:0;overscroll-behavior-y:contain}
button{touch-action:manipulation}
.ibtn{width:44px;height:44px}
.hdr-r{display:flex;align-items:center;gap:10px;min-width:0;flex:1;justify-content:flex-end}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.gear svg{width:20px;height:20px}
.install{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px}
.install div{flex:1;font-size:14px;line-height:1.3}
.install b{display:block;font-size:15px}
.install button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
.install .no{background:none;color:inherit;opacity:.7;padding:10px 4px}
.plan{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.plan label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.plan input{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;font-variant-numeric:tabular-nums;min-height:44px}
.plan .out{flex:1 1 170px;font-size:14px;color:var(--muted);line-height:1.35}
.plan .out b{display:block;font-family:var(--fd);font-weight:700;font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.set .opts{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex:none}
.set .opts button{border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:14px;min-height:36px;font-variant-numeric:tabular-nums}
.set .opts button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.set.stack{flex-wrap:wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.player{height:100%;height:100dvh}
.clock .t{font-size:clamp(52px,11.5vh,96px)}
.pinfo h2{font-size:clamp(24px,4.2vh,34px)}
.ctrl{padding-block:4px clamp(8px,2vh,16px)}
.pstage{min-height:120px}
@media (max-height:720px){
  .ctrl button{width:52px;height:52px}.ctrl .big{width:66px;height:66px}
  .player .body{gap:7px}.pinfo p{font-size:14px}.clock .nx b{font-size:14px}
  .top{padding-block:12px 4px}.hero{padding:14px;gap:12px}.blk{font-size:34px}.start{padding:13px;font-size:20px}
}
@media (orientation:landscape) and (max-height:520px){
  .player .ph{max-width:none;padding:6px 16px 4px}
  .player .body{max-width:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:16px;row-gap:6px;padding-bottom:8px}
  .pstage{grid-column:1;grid-row:1 / span 4;min-height:0}
  .pinfo,.clock,.tbar,.ctrl,#plAsk{grid-column:2}
  .ctrl{align-self:end;padding:0}
  .clock .t{font-size:clamp(44px,17vh,80px)}
  .fin{grid-column:1 / -1}
  .tabbar button{padding:5px 4px 6px}
  .ctrl button{width:46px;height:46px}.ctrl .big{width:58px;height:58px}
  .pinfo p{display:none}
  #plAsk{padding:8px 10px}
}
@media (max-width:420px){.today{display:none}}
</style>
<!-- verbund-design:start -->
<script data-design="rodeln" data-sync="rodeln" src="../../sg/design.js?v=3.0.0"></script>
<!-- verbund-design:end -->
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 52 28" aria-hidden="true"><path d="M3 20 Q10 26 22 22 L46 14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M14 17 L40 9" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/></svg>
      Mobility
    </div>
    <div class="hdr-r"><div class="today" id="today"></div><button class="gear" id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>
  <main>
    <section class="view" id="v-heute"></section>
    <section class="view" id="v-wettkampf" hidden></section>
    <section class="view" id="v-uebungen" hidden></section>
    <section class="view" id="v-fortschritt" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="Bereiche">
  <div class="in">
    <button data-tab="heute" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Heute</button>
    <button data-tab="wettkampf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>Wettkampf</button>
    <button data-tab="uebungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Übungen</button>
    <button data-tab="fortschritt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/></svg>Fortschritt</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div>
</div>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Training"></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="impFile" accept="application/json,.json" hidden>

<script src="js/1-app.js?v=3.0.0"></script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('../../sw.js').catch(()=>{});});}
