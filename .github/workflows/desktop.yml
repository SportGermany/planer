# Baut das PC-Programm für Ubuntu (werkzeuge/desktop, Electron) als .deb mit Release „desktop-v<version>“.
# Gebaut wird nur, wenn es für die Version in werkzeuge/desktop/package.json noch kein Release gibt (Version erhöhen = neues Paket).
name: PC-Programm bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VER=$(node -p 'require("./werkzeuge/desktop/package.json").version')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "desktop-v$VER" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "neu=nein" >> "$GITHUB_OUTPUT"; echo "Release desktop-v$VER gibt es schon"; else echo "neu=ja" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.neu == 'ja'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.v.outputs.neu == 'ja'
        name: Paket bauen
        working-directory: werkzeuge/desktop
        run: |
          npm install --no-audit --no-fund
          node www.js
          npx electron-builder --linux deb --publish never
          ls -la dist/*.deb
      - if: steps.v.outputs.neu == 'ja'
        name: Programm starten und prüfen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          cd werkzeuge/tests && npm install --no-audit --no-fund >/dev/null
          xvfb-run -a node desktop.js
      - if: steps.v.outputs.neu == 'ja'
        name: Paket installieren und als normaler Nutzer starten (Ubuntu 24.04 mit AppArmor-Sperre wie auf dem PC)
        run: |
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sudo apt-get install -y -qq ./werkzeuge/desktop/dist/planer-desktop-${{ steps.v.outputs.ver }}.deb
          ls -la /opt/Planer/chrome-sandbox /etc/apparmor.d/planer || true
          set +e; timeout 25 xvfb-run -a /usr/bin/planer > "$RUNNER_TEMP/start.log" 2>&1; rc=$?; set -e
          grep -i "sandbox\|FATAL" "$RUNNER_TEMP/start.log" | head -20 || true
          # 124 = lief bis zum Zeitlimit, also gestartet; alles andere = Abbruch beim Start
          if [ "$rc" != "124" ]; then echo "::error::Planer startete nicht (Code $rc)"; tail -40 "$RUNNER_TEMP/start.log"; exit 1; fi
          echo "Planer läuft als normaler Nutzer"
          test -f /usr/share/applications/planer-schule.desktop && test -f /opt/Planer/resources/schule.svg || { echo "::error::Starter Schule fehlt"; exit 1; }
          set +e; timeout 20 xvfb-run -a /usr/bin/planer --app=schule > "$RUNNER_TEMP/schule.log" 2>&1; rc=$?; set -e
          if [ "$rc" != "124" ]; then echo "::error::Schule startete nicht (Code $rc)"; tail -40 "$RUNNER_TEMP/schule.log"; exit 1; fi
          echo "Schule läuft als eigenes Fenster"
      - if: steps.v.outputs.neu == 'ja'
        name: Release desktop-v${{ steps.v.outputs.ver }}
        run: |
          VER=${{ steps.v.outputs.ver }}
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **Planer für Ubuntu $VER** – Kalender, Aufgaben, Schule, Training und Bibel in einem Programm, mit Cloud-Abgleich zum Handy.

          **Installieren:** \`planer-desktop-$VER.deb\` herunterladen, doppelklicken (Ubuntu-Software) – oder im Terminal: \`sudo apt install ./planer-desktop-$VER.deb\`.
          Danach im App-Menü „Planer“ starten – oder „Schule“ (die Schul-App im eigenen Fenster, gleiche Daten). **Update:** neue .deb genauso installieren, die Daten bleiben.
          **Handy-Daten:** im Programm Mehr › Sicherung › Cloud mit demselben Zugang wie auf dem Handy verbinden.
          NOTES
          gh release delete "desktop-v$VER" --yes 2>/dev/null || true
          gh release create "desktop-v$VER" werkzeuge/desktop/dist/planer-desktop-$VER.deb --target "$GITHUB_SHA" --title "Planer für Ubuntu $VER" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
