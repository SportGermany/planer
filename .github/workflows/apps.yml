# Baut die Einzel-Apps aus werkzeuge/apps.json (alle außer „planer“ – die baut apk.yml) als eigene APK mit Release „<app>-v<ver>“.
# Gebaut wird nur eine App, für deren Version es noch kein Release gibt (Version in apps.json erhöhen = neue APK).
# Plan und Hintergrund: werkzeuge/PLAN-APPS.md. Signatur wie bei der Planer-App (Secret APK_PASSWORT).
name: Apps bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      app:
        description: "Nur diese App neu bauen (Release ersetzen), z. B. bibel"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.p.outputs.liste }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          L=$(node -e '
            const a = require("./werkzeuge/apps.json"), { execSync } = require("child_process"), only = process.argv[1];
            const out = Object.keys(a).filter(k => k[0] !== "_" && k !== "planer").filter(k => {
              if (only) return k === only;
              try { execSync("gh release view " + k + "-v" + a[k].ver, { stdio: "ignore" }); return false; } catch (e) { return true; }
            });
            console.log(JSON.stringify(out));' "${{ inputs.app }}")
          echo "liste=$L" >> "$GITHUB_OUTPUT"; echo "Zu bauen: $L"

  app:
    needs: plan
    if: needs.plan.outputs.liste != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.liste) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_PASSWORT: ${{ secrets.APK_PASSWORT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: App ${{ matrix.app }} in das Android-Projekt kopieren
        working-directory: werkzeuge/apk
        run: |
          npm ci --no-audit --no-fund
          node www.js ${{ matrix.app }}
          cat app.env >> "$GITHUB_ENV"
          npx cap sync android
      - name: Schlüssel entschlüsseln
        if: env.APK_PASSWORT != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in werkzeuge/apk/planer-schluessel.enc -out "$RUNNER_TEMP/planer.keystore" -pass env:APK_PASSWORT
          echo "PLANER_KEYSTORE=$RUNNER_TEMP/planer.keystore" >> "$GITHUB_ENV"
          echo "PLANER_PASSWORT=$APK_PASSWORT" >> "$GITHUB_ENV"
      - name: APK bauen
        working-directory: werkzeuge/apk/android
        run: |
          chmod +x gradlew
          TASKS=assembleDebug; [ -n "$PLANER_KEYSTORE" ] && TASKS="assembleDebug assembleRelease"
          ./gradlew $TASKS -PplanerVersion=$VER -PappId=$APP_ID --no-daemon
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/test.apk"
          [ -n "$PLANER_KEYSTORE" ] && cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$APP-$VER.apk" || true
      - name: Playwright (nur für adb/WebView)
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator-Test ${{ matrix.app }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Berlin
          script: |
            adb install -r "$RUNNER_TEMP/test.apk"
            OUT=emu-out node werkzeuge/tests/emulator-app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.app }}
          path: emu-out
          retention-days: 14
      - name: Release ${{ matrix.app }}-v${{ env.VER }}
        if: env.APK_PASSWORT != ''
        run: |
          gh release delete "$APP-v$VER" --yes --cleanup-tag >/dev/null 2>&1 || true
          printf 'Android-App **%s %s**\n\n**Installieren:** `%s-%s.apk` auf dem Handy herunterladen, antippen, „Installieren“. Läuft neben der Planer-App.\n**Update:** in der App unter Einstellungen › Version.\n' "$APP_NAME" "$VER" "$APP" "$VER" > "$RUNNER_TEMP/notes.md"
          gh release create "$APP-v$VER" "$RUNNER_TEMP/out/$APP-$VER.apk" --target "$GITHUB_SHA" --title "$APP_NAME $VER" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
